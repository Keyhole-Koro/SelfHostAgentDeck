  const removable = c.worktrees.filter((w) => w.removable);
  const kept = c.worktrees.filter((w) => !w.removable);
  html += `<div class="block"><div class="label">Worktrees that can go · ${removable.length}</div>`;
  html += removable.length
    ? removable
        .map((w) => {
          const why = w.prunable ? "its folder is gone" : w.merged ? "merged" : "its remote branch was deleted";
          const cmds = w.commands.join(" && ");
          return `<div class="wt"><code class="cmd">${esc(w.path)}</code> ${w.branch ? `<span class="sub">${esc(w.branch)}</span>` : ""} <span class="sub">· ${esc(why)}</span><div class="actions"><code class="cmd">${esc(cmds)}</code><button class="btn small" data-copy="${esc(cmds)}">Copy</button></div></div>`;
        })
        .join("")
    : `<p class="note">None.</p>`;
  if (kept.length) html += `<p class="note">Kept: ${kept.map((w) => `${esc(base(w.path))} (${w.sessions.length ? "in use" : w.dirty ? "uncommitted changes" : w.locked ? "locked" : "not merged"})`).join(", ")}</p>`;
  html += `</div>`;
  $("special").innerHTML = html;
}

// ------------------------------------------------------------ remote access

async function paintRemote() {
  let r;
  try {
    r = await api("/api/remote");
  } catch (e) {
    $("special").innerHTML = pageHead("Remote") + `<div class="note error">${esc(e.message)}</div>`;
    return;
  }
  if (selected !== "remote") return;
  let html = pageHead(
    "Remote",
    r.origin
      ? `Open <a href="${esc(r.origin)}" target="_blank" rel="noopener">${esc(r.origin)}</a> on a device you added, and sign in with its passkey.`
      : "Remote access is off. Start <code class=\"cmd\">agent-diff view --remote https://…</code> behind a Cloudflare Tunnel to use this page from your phone.",
  );
  html += `<div class="actions">${mode === "local" && r.origin ? '<button class="btn primary" data-remote="pair">Add a phone</button>' : ""}${mode === "remote" ? '<button class="btn" data-remote="logout">Sign out</button>' : ""}</div><div id="pairing"></div>`;
  html += `<div class="block"><div class="label">Devices · ${r.devices.length}</div>`;
  html += r.devices.length
    ? `<table class="clean"><tr><th>Device</th><th>Added</th><th>Last used</th><th></th></tr>${r.devices
        .map((d) => `<tr><td>${esc(d.label)}${d.current ? ' <span class="sub">(this one)</span>' : ""}</td><td>${esc(when(d.createdAt))}</td><td>${esc(d.lastUsedAt ? when(d.lastUsedAt) : "")}</td><td><button class="btn small" data-remote="revoke" data-id="${esc(d.id)}">Remove</button></td></tr>`)
        .join("")}</table>`
    : `<p class="note">None yet.${mode === "local" && r.origin ? " Add one with the button above, or agent-diff remote pair." : ""}</p>`;
  html += `</div><div class="block"><div class="label">Done from other devices</div>`;
  html += r.log.length
    ? `<ul class="list">${r.log.map((e) => `<li><span class="sub">${esc(when(e.at))}</span> <b>${esc(e.device)}</b> ${esc(e.action)}${e.target ? ` <code class="cmd">${esc(e.target)}</code>` : ""}${e.detail ? `<div class="sub">${esc(e.detail)}</div>` : ""}</li>`).join("")}</ul>`
    : `<p class="note">Nothing yet.</p>`;
  $("special").innerHTML = html + "</div>";
}

// ------------------------------------------------------------ painting and events

/** Repaints what changed: the list, the header, and the parts of the session on show. */
function paint() {
  pickDefault();
  saveHash();
  paintHeader();
  paintNav();
  layout();
  if (special()) return;
  const e = entry(selected);
  paintHead(e);
  paintTabs(e);
  paintInfo(e);
  if (tab === "chat") {
    syncChat(e);
    paintDock(e);
    if ($("prompt") && !$("prompt").style.height) grow($("prompt"));
  } else if (tab === "changes") syncChanges(e);
  else if (tab === "files") syncFiles(e);
}

function select(key) {
  if (!key) return;
  if (key !== selected) {
    selected = key;
    shown = {};
    $("changes").innerHTML = "";
  }
  if (key === "cleanup" || key === "remote") {
    saveHash();
    paintHeader();
    paintNav();
    layout();
    void (key === "cleanup" ? paintCleanup() : paintRemote());
  } else paint();
}

/** Opens a session (or clean-up, remote); on a phone, over the list, so Back returns to it. */
function openSession(key) {
  if (phone.matches && document.body.dataset.view !== "session") {
    history.pushState({ session: key }, "");
    pushed = true;
    document.body.dataset.view = "session";
  }
  select(key);
}

function back() {
  if (pushed) return history.back();
  document.body.dataset.view = "list";
  if (special()) {
    selected = null;
    shown = {};
  }
  paint();
}

addEventListener("popstate", () => {
  pushed = false;
  if (document.body.dataset.view === "session") {
    document.body.dataset.view = "list";
    if (special()) selected = null;
    shown = {};
    paint();
  }
});
phone.addEventListener("change", () => {
  document.body.dataset.view = phone.matches ? "list" : "session";
  shown = {};
  paint();
});
wide.addEventListener("change", () => {
  shown = {};
  paint();
});

function setTab(t) {
  if (!TABS.includes(t)) return;
  tab = t;
  store("tab", t);
  paint();
  if (t === "chat") $("chat").scrollTop = $("chat").scrollHeight;
}

function setRange(r) {
  range = r;
  shown.changesFor = "";
  $("changes").innerHTML = "";
  if (inbox && inbox.home) void loadHome().then(paint);
  else paint();
}

async function act(name, el) {
  const i = entry(selected) && entry(selected).item;
  const note = (id, text, ok) => {
    const n = $(id);
    if (n) ((n.textContent = text), (n.className = "note" + (ok ? " ok" : " error")));
  };
  try {
    if (name === "back") back();
    else if (name === "earlier") await loadChat("earlier");
    else if (name === "expand") {
      const bubble = el.previousElementSibling;
      bubble.classList.remove("long");
      el.remove();
    } else if (name === "focus") {
      await post("/api/herdr/focus", { key: i.key });
      note("act-note", "Focused in herdr.", true);
    } else if (name === "later" || name === "done") {
      await post("/api/hold", { key: i.key, kind: name, until: el.dataset.until });
      await loadInbox();
    } else if (name === "release") {
      await post("/api/release", { key: i.key });
      await loadInbox();
    } else if (name === "screen") {
      screens.set(i.key, await api(`/api/herdr/screen?key=${encodeURIComponent(i.key)}`));
      if (selected !== i.key) return;
      shown.dock = "";
      paintDock(entry(selected));
      if ($("screen")) $("screen").scrollTop = $("screen").scrollHeight;
    } else if (name === "prompt") {
      const text = $("prompt").value.trim();
      if (!text) return;
      await sendPrompt(i, text);
      drafts.delete(i.key);
      if ($("prompt")) ($("prompt").value = ""), grow($("prompt"));
    } else if (name === "quick") {
      await sendPrompt(i, el.dataset.quick);
    } else if (name === "edit-quick") {
      const v = window.prompt("One-tap replies, separated by |", quick.join(" | "));
      if (v === null) return;
      quick = v.split("|").map((x) => x.trim()).filter(Boolean);
      store("quick", quick);
      shown.dock = "";
      paint();
    } else if (name === "copy-review") {
      await navigator.clipboard.writeText(reviewText(selected));
      note("review-note", "Copied. Paste it into the session.", true);
    } else if (name === "send-review") {
      await post("/api/herdr/prompt", { key: i.key, text: reviewText(selected) });
      delete comments[selected];
      store("comments", comments);
      $("review-slot").innerHTML = `<p class="note ok">Sent to the session.</p>`;
      shown.changesFor = "";
    } else if (name === "clear-review") {
      delete comments[selected];
      store("comments", comments);
      shown.changesFor = "";
      paint();
    }
  } catch (e) {
    note(name === "prompt" || name === "screen" ? "answer-note" : name.endsWith("review") ? "review-note" : "act-note", e.message, false);
  }
}

async function sendPrompt(i, text) {
  await post("/api/herdr/prompt", { key: i.key, text });
  const n = $("answer-note");
  if (n) ((n.textContent = "Sent."), (n.className = "note ok"));
  setTimeout(() => void loadChat("newer"), 1500);
}

async function pressKey(k) {
  const i = entry(selected) && entry(selected).item;
  try {
    await post("/api/herdr/keys", { key: i.key, keys: [k] });
    $("answer-note").textContent = `Sent ${k}.`;
    $("answer-note").className = "note ok";
    setTimeout(() => $("screen") && act("screen"), 700); // show what it did, and what it asks next
  } catch (e) {
    $("answer-note").textContent = e.message;
    $("answer-note").className = "note error";
  }
}

$("nav").addEventListener("click", (ev) => {
  const project = ev.target.closest(".project");
  const f = ev.target.closest(".fold");
  if (project || f) {
    toggle(project ? fold.projects : fold[f.dataset.fold], (project || f).dataset.project);
    saveFold();
    paintNav();
    return;
  }
  const b = ev.target.closest(".session");
  if (b) openSession(b.dataset.key);
});

document.addEventListener("keydown", (ev) => {
  if (ev.target.closest && ev.target.closest("input, textarea")) return;
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const step = ev.key === "ArrowDown" || ev.key === "j" ? 1 : ev.key === "ArrowUp" || ev.key === "k" ? -1 : 0;
  if (!step) return;
  const keys = [...$("nav").querySelectorAll(".session")].map((b) => b.dataset.key);
  if (!keys.length || phone.matches) return;
  ev.preventDefault();
  select(keys[Math.min(keys.length - 1, Math.max(0, keys.indexOf(selected) + step))]);
  const cur = $("nav").querySelector('.session[aria-current="true"]');
  if (cur) cur.scrollIntoView({ block: "nearest" });
});

/** One handler for the session parts: the conversation, its dock, the tabs, files, changes, details. */
$("app").addEventListener("click", (ev) => {
  const t = ev.target;
  if (t.closest("#nav")) return;
  const copy = t.closest("[data-copy]");
  if (copy) {
    navigator.clipboard?.writeText(copy.dataset.copy).then(() => ((copy.textContent = "Copied"), setTimeout(() => (copy.textContent = "Copy"), 1200)));
    return;
  }
  const tb = t.closest("[data-tab]");
  if (tb) return void setTab(tb.dataset.tab);
  const file = t.closest("[data-file]");
  if (file) {
    ev.preventDefault();
    let path = file.dataset.file;
    // A relative link in a Markdown file is relative to that file.
    const doc = file.closest(".doc");
    if (doc && !/^[/~]/.test(path)) path = `${doc.dataset.dir}/${path}`;
    void openFiles(path);
    if (tab !== "files") setTab("files");
    return;
  }
  const o = t.closest("[data-open]");
  if (o) {
    void openFiles(o.dataset.open);
    if (tab !== "files") setTab("files");
    return;
  }
  const go = t.closest("[data-goto]");
  if (go) return void openSession(go.dataset.goto);
  const a = t.closest("[data-act]");
  if (a) return void act(a.dataset.act, a);
  const k = t.closest("[data-key-press]");
  if (k) return void pressKey(k.dataset.keyPress);
  const q = t.closest("[data-quick]");
  if (q) return void act("quick", q);
  const c = t.closest("[data-comment]");
  if (c) {
    const ed = [...document.querySelectorAll("[data-editor]")].find((x) => x.dataset.editor === c.dataset.comment);
    if (ed) {
      ed.hidden = !ed.hidden;
      if (!ed.hidden) ed.querySelector("textarea").focus();
    }
    return;
  }
  const save = t.closest("[data-save-comment]");
  if (save) {
    const ed = save.closest("[data-editor]");
    const text = ed.querySelector("textarea").value.trim();
    if (!text) return;
    const [file, header] = save.dataset.saveComment.split("\n");
    const hunkHead = [...document.querySelectorAll(".hunk-head")].find((h) => h.querySelector("[data-comment]") && h.querySelector("[data-comment]").dataset.comment === save.dataset.saveComment);
    const excerpt = [];
    for (let n = hunkHead && hunkHead.nextElementSibling; n && n.classList.contains("l") && excerpt.length < 6; n = n.nextElementSibling) if (/^[+-]/.test(n.textContent)) excerpt.push(n.textContent);
    (comments[selected] ||= []).push({ id: save.dataset.saveComment, file, header, excerpt, text });
    store("comments", comments);
    shown.changesFor = "";
    paint();
    return;
  }
  const un = t.closest("[data-uncomment]");
  if (un) {
    (comments[selected] || []).splice(Number(un.dataset.uncomment), 1);
    if (!(comments[selected] || []).length) delete comments[selected];
    store("comments", comments);
    shown.changesFor = "";
    paint();
    return;
  }
  const r = t.closest("[data-range]");
  if (r) return void setRange(r.dataset.range);
  if (t.closest("#reload")) {
    void paintChanges(entry(selected), true);
    if (inbox && inbox.home) void loadHome().then(paint);
  }
});

// Opened or closed by you (a details drawn open fires "toggle" too, so count clicks).
$("dock").addEventListener("click", (ev) => {
  const summary = ev.target.closest && ev.target.closest("details.more-keys > summary");
  if (summary) keysOpen = !summary.parentElement.open;
});
// Remember which runs of steps were opened, across repaints.
$("chat").addEventListener("toggle", (ev) => {
  const d = ev.target;
  if (!d.matches || !d.matches("details.steps")) return;
  if (d.open) chat.open.add(d.dataset.group);
  else chat.open.delete(d.dataset.group);
}, true);
// Scrolled to the top: read the page before.
$("chat").addEventListener("scroll", () => {
  if ($("chat").scrollTop < 40 && chat.state === "ready" && chat.before !== undefined) void loadChat("earlier");
});

$("app").addEventListener("keydown", (ev) => {
  if (ev.target.id === "custom" && ev.key === "Enter") setRange(rangeFromInput(ev.target.value));
  if (ev.target.id === "prompt" && ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) act("prompt");
});
$("app").addEventListener("input", (ev) => {
  if (ev.target.id === "prompt") {
    drafts.set(selected, ev.target.value);
    grow(ev.target);
  }
});

for (const id of ["cleanup", "remote"]) {
  $(id).onclick = () => {
    if (selected !== id) return openSession(id);
    selected = null; // back to the sessions
    shown = {};
    paint();
  };
}

$("app").addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-remote]");
  if (!b) return;
  try {
    if (b.dataset.remote === "pair") {
      const p = await post("/api/remote/pair", {});
      $("pairing").innerHTML = `<div class="pair"><div class="qr">${p.svg}</div><div><p>Scan this with the phone to add, or open the link on it. It works once, until ${esc(new Date(p.expiresAt).toLocaleTimeString())}.</p><code class="cmd">${esc(p.url)}</code> <button class="btn small" data-copy="${esc(p.url)}">Copy</button></div></div>`;
    } else if (b.dataset.remote === "revoke") {
      if (!confirm("Remove this device? Its passkey stops working here.")) return;
      await post("/api/remote/revoke", { id: b.dataset.id });
      void paintRemote();
    } else if (b.dataset.remote === "logout") {
      await fetch("/auth/logout", { method: "POST", headers: { "x-agent-diff": "1" }, credentials: "same-origin" });
      location.assign("/login");
    }
  } catch (e) {
    $("pairing").innerHTML = `<p class="note error">${esc(e.message)}</p>`;
  }
});

setInterval(() => {
  if ((token || mode === "remote") && !document.hidden) void loadInbox();
}, 5000);

if (!phone.matches) document.body.dataset.view = "session";
if (!token && mode === "local") $("main").innerHTML = '<div class="error empty">Open the full URL that agent-diff printed (it carries the access token).</div>';
else void loadInbox();
</script>
</body>
</html>
