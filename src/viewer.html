<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agent Deck">
<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
<title>Agent Deck</title>
<style>
:root {
  --bg: #faf9f6; --side: #f3f1ec; --field: #ffffff; --text: #1f1d1a; --muted: #6b665e; --faint: #9a948a; --line: #e4e0d8;
  --hover: #ebe8e1; --selected: #e5e1d8; --bubble: #ebe7df; --code-bg: #efece5;
  --accent: #3b5bdb; --accent-soft: #e7ebfb; --on-accent: #ffffff;
  --add-bg: #e4f3e7; --add-text: #1d5c2e; --del-bg: #fbe9e9; --del-text: #8a2424;
  --hunk: #6f6a62; --claude: #b45a2c; --codex: #2d6a8f;
  --recorded: #1d5c2e; --sure: #2d6a8f; --likely: #8a6a12; --maybe: #8a2424;
  --urgent: #b42318; --urgent-soft: #fbe8e6; --warn: #8a6a12; --warn-soft: #f7efd6; --ok: #1d5c2e;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
  --col: 860px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1a18; --side: #201f1d; --field: #252421; --text: #ece9e4; --muted: #a29c92; --faint: #79746b; --line: #34322e;
    --hover: #292826; --selected: #302e2b; --bubble: #2d2b28; --code-bg: #262422;
    --accent: #8ea6ff; --accent-soft: #252e50; --on-accent: #10131f;
    --add-bg: #1c3123; --add-text: #9fdcae; --del-bg: #382121; --del-text: #f0a5a5;
    --hunk: #9c968c; --claude: #e39a72; --codex: #7fb8dc;
    --recorded: #9fdcae; --sure: #7fb8dc; --likely: #e3c56f; --maybe: #f0a5a5;
    --urgent: #ff9b8f; --urgent-soft: #3a2220; --warn: #e3c56f; --warn-soft: #362f1e; --ok: #9fdcae;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); -webkit-text-size-adjust: 100%; }
button, input, textarea { font: inherit; color: inherit; }
/* Touch screens: iOS zooms into a text box whose text is under 16px; a double tap on a button must not zoom either. */
@media (pointer: coarse) {
  input, textarea, select { font-size: 16px !important; }
  button, a, summary, .session, .choice, .card { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
}
a { color: var(--accent); }
code, pre { font-family: var(--mono); }

/* ---------------------------------------------------------------- app bar */
header#top { flex: none; min-height: 52px; padding: 8px 20px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; border-bottom: 1px solid var(--line); background: var(--side); }
header#top h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.summary { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.summary b { color: var(--text); font-weight: 650; }
.summary .urgent b { color: var(--urgent); }
.tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 12px; color: var(--muted); }
.limits.high { color: var(--warn); font-weight: 600; }
/* Icon buttons, a segmented switch and menus, instead of rows of boxed buttons. */
.icon-btn { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.icon-btn svg, .seg svg, .new-btn svg, .send-btn svg { display: block; }
.seg { display: inline-flex; align-items: center; gap: 2px; padding: 2px; border-radius: 9px; background: var(--hover); }
.seg button { display: inline-flex; align-items: center; justify-content: center; height: 26px; min-width: 30px; padding: 0 6px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }
.seg .seg-sep { width: 1px; height: 16px; background: var(--line); margin: 0 2px; }
.new-btn { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px 4px 8px; font-size: 13px; }
.menu { position: relative; }
.menu > summary { list-style: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu[open] > summary { background: var(--hover); color: var(--text); }
.menu-list { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 200px; padding: 6px; display: grid; gap: 2px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); box-shadow: 0 10px 28px rgba(0, 0, 0, .18); }
.menu-list button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: var(--text); text-align: left; font-size: 14px; cursor: pointer; white-space: nowrap; }
.menu-list button:hover { background: var(--hover); }
.menu-list button[aria-pressed="true"] { color: var(--accent); }
.menu-list button svg { color: var(--muted); }
.menu-note { margin-top: 4px; padding: 6px 10px 2px; border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); }
.menu-note:empty { display: none; }
.send-btn { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%; background: var(--accent); color: var(--on-accent); cursor: pointer; }
.send-btn:hover { filter: brightness(1.08); }
.send-btn.small { width: 30px; height: 30px; }
.send-btn.done { background: var(--ok); color: var(--bg); transition: background .2s; }
.choice.picked { border-color: var(--accent); background: var(--hover); }

/* ---------------------------------------------------------------- columns */
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr) 340px; }
nav#nav { min-height: 0; overflow-y: auto; background: var(--side); border-right: 1px solid var(--line); padding: 4px 0 24px; overscroll-behavior: contain; }
main#main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
aside#side { min-height: 0; overflow-y: auto; background: var(--side); border-left: 1px solid var(--line); overscroll-behavior: contain; }
body.special aside#side { display: none; }
body.special main#main { grid-column: 2 / -1; }
@media (min-width: 1680px) { .app { grid-template-columns: 320px minmax(0, 1fr) 400px; } :root { --col: 940px; } }
@media (max-width: 1279px) { .app { grid-template-columns: 280px minmax(0, 1fr); } aside#side { display: none; } }
@media (max-width: 1023px) { .app { grid-template-columns: 248px minmax(0, 1fr); } .tabs-row .tab-meta { display: none; } }

/* ---------------------------------------------------------------- session list */
.project { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; cursor: pointer; text-align: left; padding: 14px 18px 6px; font-size: 13px; font-weight: 650; color: var(--muted); letter-spacing: .01em; }
.project:not(:first-child) { margin-top: 6px; }
.project .chev { flex: none; width: 10px; font-size: 10px; }
.project:hover { color: var(--text); }
.project .pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; color: var(--text); }
.counts { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.c { font-size: 11px; font-weight: 650; min-width: 18px; text-align: center; border-radius: 9px; padding: 0 5px; line-height: 17px; }
.c.needs-answer { background: var(--urgent); color: var(--bg); }
.c.your-turn { background: var(--accent-soft); color: var(--accent); }
.c.other { color: var(--muted); font-weight: 400; padding: 0; }
.fold { display: block; width: 100%; border: 0; background: none; cursor: pointer; text-align: left; padding: 4px 18px 4px 36px; font-size: 12px; color: var(--muted); }
.fold:hover { color: var(--text); }
.session { display: block; width: calc(100% - 12px); margin: 1px 6px; text-align: left; border: 0; background: none; padding: 7px 12px 8px 10px; cursor: pointer; border-radius: 8px; }
.session:hover { background: var(--hover); }
.session[aria-current="true"] { background: var(--selected); }
.session:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.row1 { display: flex; gap: 7px; align-items: center; }
.row1 .name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.row1 .age { margin-left: auto; color: var(--faint); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row2 { display: flex; gap: 6px; font-size: 13px; color: var(--muted); padding-left: 15px; min-width: 0; margin-top: 1px; }
.row2 .where { white-space: nowrap; }
.row2 .agent { flex: none; }
.row2 .snip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--faint); }
.dot.needs-answer { background: var(--urgent); border-color: var(--urgent); }
.dot.your-turn { background: var(--accent); border-color: var(--accent); }
.dot.working { border-style: dashed; border-color: var(--muted); animation: spin 2.4s linear infinite; }
.dot.closed { border-color: var(--line); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .dot.working { animation: none; } }
.chip { flex: none; font-size: 11px; font-weight: 650; border: 1px solid currentColor; border-radius: 9px; padding: 0 5px; line-height: 15px; color: var(--muted); }
.chip.ask, .chip.failing, .chip.conflict { color: var(--urgent); }
.chip.pending, .chip.ctx { color: var(--warn); }
.chip.passing { color: var(--ok); }
.agent { font-weight: 650; font-size: 12px; }
.agent.claude { color: var(--claude); }
.agent.codex { color: var(--codex); }
.nav-empty { color: var(--muted); font-size: 13px; padding: 14px 18px; }
.keys { color: var(--faint); font-size: 12px; padding: 18px 18px 0; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

/* ---------------------------------------------------------------- session head and tabs */
.shead { flex: none; padding: 10px 16px 4px 24px; }
.shead-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.head-actions { margin-left: auto; display: flex; align-items: center; gap: 2px; flex: none; }
.back { display: none; margin-left: -8px; color: var(--accent); }
.shead h2 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { flex: none; font-size: 12px; font-weight: 650; border-radius: 10px; padding: 1px 9px; background: var(--hover); color: var(--muted); white-space: nowrap; }
.pill.needs-answer { background: var(--urgent-soft); color: var(--urgent); }
.pill.your-turn { background: var(--accent-soft); color: var(--accent); }
.meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: center; margin-top: 4px; }
.meta .path { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.actions { margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tabs-row { flex: none; display: flex; align-items: flex-end; gap: 16px; padding: 0 16px 0 20px; border-bottom: 1px solid var(--line); min-width: 0; }
.tab-meta { margin-left: auto; min-width: 0; display: flex; gap: 12px; padding-bottom: 10px; font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; }
.tab-meta .agent { font-size: 12px; }
.tabs { flex: none; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 8px 10px 9px; font-size: 14px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
.tabs .n { color: var(--faint); font-weight: 400; margin-left: 3px; }

/* ---------------------------------------------------------------- panes */
.pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.pane.scroll { display: block; overflow-y: auto; overscroll-behavior: contain; }
.col { max-width: var(--col); margin: 0 auto; padding: 18px 24px 40px; }
.col.wide { max-width: 1240px; }

/* ---------------------------------------------------------------- conversation */
.chat { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.chat .col { padding-bottom: 20px; }
.earlier, .start { text-align: center; margin: 4px 0 18px; }
.start { color: var(--faint); font-size: 12px; }
.when { text-align: center; color: var(--faint); font-size: 12px; margin: 22px 0 10px; font-variant-numeric: tabular-nums; }
.msg { margin: 10px 0; }
.msg.me { display: flex; flex-direction: column; align-items: flex-end; }
.bubble { max-width: min(82%, 640px); background: var(--bubble); border-radius: 18px 18px 6px 18px; padding: 9px 14px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.7; }
.bubble.long { max-height: 15em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.msg.me.command .bubble, .msg.me.shell .bubble { background: transparent; border: 1px solid var(--line); font-size: 13px; }
.msg.me.answer .bubble { background: var(--accent-soft); }
.more-btn { margin-top: 4px; font-size: 13px; }
.msg.ai { padding-right: 4%; }
.md { line-height: 1.75; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 .7em; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 1.1em 0 .45em; line-height: 1.35; font-weight: 650; }
.md h1 { font-size: 1.35em; } .md h2 { font-size: 1.2em; } .md h3 { font-size: 1.07em; } .md h4, .md h5, .md h6 { font-size: 1em; }
.md ul, .md ol { margin: 0 0 .7em; padding-left: 1.4em; }
.md li { margin: .15em 0; }
.md li > p { margin: 0 0 .3em; }
.md li > ul, .md li > ol { margin-bottom: .2em; }
.md .task { color: var(--muted); } .md .task.done { color: var(--ok); }
.md blockquote { margin: 0 0 .7em; padding: 0 0 0 12px; border-left: 3px solid var(--line); color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
.md code { font-size: .88em; background: var(--code-bg); padding: .1em .35em; border-radius: 5px; }
.md pre.code { margin: 0 0 .8em; padding: 10px 12px; background: var(--code-bg); border-radius: 8px; overflow-x: auto; font-size: 12.5px; line-height: 1.55; }
.md pre.code code { background: none; padding: 0; font-size: inherit; }
.md .table { overflow-x: auto; margin: 0 0 .8em; }
.md table { border-collapse: collapse; font-size: .93em; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 5px 12px 5px 0; text-align: left; vertical-align: top; }
.md th { font-weight: 650; color: var(--muted); }
a.file { text-decoration: underline dotted; text-underline-offset: 2px; }
.md code a.file { color: inherit; }
.steps { margin: 6px 0; font-size: 13px; color: var(--muted); }
.steps > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; padding: 3px 0; width: fit-content; max-width: 100%; }
.steps > summary::-webkit-details-marker { display: none; }
.steps > summary::before { content: "▸"; font-size: 10px; width: 10px; color: var(--faint); }
.steps[open] > summary::before { content: "▾"; }
.steps > summary:hover { color: var(--text); }
.steps .count { font-weight: 600; }
.steps .names { color: var(--faint); }
.steps .failed { color: var(--urgent); }
.steps .latest { flex-basis: 100%; padding-left: 18px; font-family: var(--mono); font-size: 12px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps ol { list-style: none; margin: 4px 0 6px 4px; padding: 0 0 0 12px; border-left: 2px solid var(--line); }
.step { display: flex; gap: 10px; padding: 2px 0; min-width: 0; }
.step .tname { flex: none; min-width: 52px; font-weight: 600; color: var(--muted); }
.step .tdetail { font-family: var(--mono); font-size: 12px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.step.failed .tname { color: var(--urgent); }
.event { text-align: center; color: var(--faint); font-size: 12px; margin: 14px 0; }
.event.warn { color: var(--warn); }
.event-box { margin: 10px 0; font-size: 13px; color: var(--muted); }
.event-box > summary { cursor: pointer; }
.event-box .md, .event-box pre { margin-top: 8px; }
.event-box pre { background: var(--code-bg); border-radius: 8px; padding: 10px 12px; font-size: 12px; overflow-x: auto; }
.recap { margin: 16px 0; padding: 2px 0 2px 14px; border-left: 3px solid var(--accent); }
.label { font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }

/* ---------------------------------------------------------------- dock: question, keys, reply */
.dock { flex: none; border-top: 1px solid var(--line); background: var(--bg); max-height: 75%; overflow-y: auto; }
.dock .col { padding: 10px 24px calc(12px + env(safe-area-inset-bottom)); }
.asking { padding: 2px 0 2px 12px; border-left: 3px solid var(--urgent); margin-bottom: 8px; }
.asking-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.reason { font-family: var(--mono); font-size: 13px; color: var(--urgent); overflow-wrap: anywhere; }
.q { margin-top: 8px; font-weight: 600; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.opt { border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 4px 12px; font-size: 14px; text-align: left; }
button.opt { cursor: pointer; }
button.opt:hover { border-color: var(--accent); color: var(--accent); }
.keypad { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.key { min-width: 38px; border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 3px 9px; cursor: pointer; font-size: 13px; font-family: var(--mono); }
.key:hover { background: var(--hover); }
.choices { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.choice { display: flex; gap: 10px; align-items: baseline; text-align: left; border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 9px 12px; cursor: pointer; font-size: 14px; line-height: 1.45; }
.choice:hover, .choice.selected { border-color: var(--accent); }
.choice .k { flex: none; font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 1.1em; }
.more-keys { margin-top: 10px; font-size: 13px; }
.more-keys > summary { cursor: pointer; color: var(--muted); width: fit-content; }
.plan-doc { margin: 8px 0 4px; }
.plan-doc > summary { cursor: pointer; font-weight: 600; }
.plan-doc .md { max-height: 42vh; overflow-y: auto; margin-top: 6px; padding-right: 6px; }
.quick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 8px; }
.chip-btn { flex: none; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.chip-btn:hover { background: var(--hover); }
.chip-btn.ghost { color: var(--muted); }
.tune-panel { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; font-size: 12px; color: var(--muted); }
.tune-panel .lbl { margin-left: 4px; }
.screen { margin: 10px 0 0; padding: 10px 12px; background: var(--code-bg); border-radius: 8px; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 28vh; overflow-y: auto; }
.composer { display: flex; gap: 4px; align-items: flex-end; border: 1px solid var(--line); background: var(--field); border-radius: 16px; padding: 5px; }
.composer textarea { padding: 6px 4px; }
.composer:focus-within { border-color: var(--accent); }
.composer textarea { flex: 1; min-width: 0; border: 0; background: transparent; resize: none; outline: none; padding: 5px 0; line-height: 1.5; max-height: 35vh; }
.hint { margin: 6px 2px 0; }
.attached { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.att { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 8px; padding: 2px 2px 2px 9px; font-size: 12px; max-width: 240px; }
.att .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att button { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 15px; padding: 0 6px; }
.btn.icon { padding: 4px 11px; font-size: 17px; line-height: 1.2; }
.sub { color: var(--muted); font-size: 12px; }
.note { color: var(--muted); font-size: 14px; margin: 6px 0; }
.outside { display: grid; gap: 8px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 12px; margin: 4px 0; }
.outside p { margin: 0; }
.outside .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; }
.card-outside { margin: 0; font-size: 13px; color: var(--muted); }
.card-outside button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
.note:empty { display: none; }
.note.ok { color: var(--ok); }
.note.error, .error { color: var(--del-text); }
.empty { color: var(--muted); padding: 48px 0; text-align: center; }

/* ---------------------------------------------------------------- buttons */
.btn { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 4px 12px; cursor: pointer; font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { padding: 1px 8px; font-size: 12px; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; font-size: inherit; }
code.cmd { font-size: 12.5px; background: var(--code-bg); padding: 2px 6px; border-radius: 5px; overflow-wrap: anywhere; }

/* ---------------------------------------------------------------- details */
#info { padding: 6px 0 32px; }
.sec { padding: 14px 20px; border-bottom: 1px solid var(--line); }
.sec:last-child { border-bottom: 0; }

.sec h3 .n { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--text); }
.sec.warn { background: var(--warn-soft); }

#pane-details #info { max-width: var(--col); margin: 0 auto; padding: 6px 4px 40px; }
.tasks, .list { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.tasks li { display: flex; gap: 8px; padding: 2px 0; }
.tasks .mark { flex: none; width: 1.2em; text-align: center; color: var(--muted); }
.tasks .completed { color: var(--muted); text-decoration: line-through; }
.tasks .in_progress .mark { color: var(--accent); }
.list li { padding: 3px 0; overflow-wrap: anywhere; }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 2px 0 8px; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.bar.warn > span { background: var(--warn); }
.bar.full > span { background: var(--urgent); }
.ci-failing { color: var(--urgent); } .ci-pending { color: var(--warn); } .ci-passing { color: var(--ok); }
.ci-log { margin: 6px 0 4px; }
.ci-log pre { margin: 0 0 6px; padding: 8px 10px; background: var(--code-bg); border-radius: 8px; font-size: 11.5px; line-height: 1.5; max-height: 32vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* ---------------------------------------------------------------- files */
.crumbs { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; font-family: var(--mono); font-size: 13px; margin-bottom: 12px; }
.crumbs button { border: 0; background: none; padding: 2px 4px; border-radius: 5px; cursor: pointer; color: var(--accent); font: inherit; }
.crumbs button:hover { background: var(--hover); }
.crumbs .sep { color: var(--faint); }
.crumbs .here { padding: 2px 4px; font-weight: 600; }
.file-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: -4px 0 12px; }
.dir { list-style: none; margin: 0; padding: 0; }
.entry { display: flex; gap: 10px; width: 100%; align-items: baseline; border: 0; background: none; text-align: left; padding: 6px 8px; border-radius: 7px; cursor: pointer; font-family: var(--mono); font-size: 13px; }
.entry:hover { background: var(--hover); }
.entry .ico { flex: none; width: 12px; color: var(--faint); font-size: 10px; }
.entry .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry.folder .nm { color: var(--accent); }
.entry .sz { margin-left: auto; flex: none; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
pre.code.numbered { margin: 0; padding: 10px 0; background: var(--code-bg); border-radius: 8px; overflow-x: auto; font-size: 12.5px; line-height: 1.6; }
pre.code.numbered code { counter-reset: ln; display: block; min-width: max-content; }
.ln { display: block; padding: 0 16px 0 4.2em; position: relative; white-space: pre; }
.ln::before { counter-increment: ln; content: counter(ln); position: absolute; left: 0; width: 3.2em; text-align: right; color: var(--faint); }
.doc { max-width: 760px; }
img.shot { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); }

/* ---------------------------------------------------------------- changes */
.changes-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 14px; }
.changes-head h3 { margin: 0; font-size: 16px; font-weight: 650; }
.changes-head .sub { font-size: 13px; }
.ranges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: auto; }
.ranges button { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 2px 9px; cursor: pointer; font-size: 13px; }
.ranges button[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.ranges input { border: 1px solid var(--line); background: var(--field); border-radius: 8px; padding: 2px 8px; width: 160px; font-size: 13px; }
.stage-row { margin: 0 0 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.review { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; padding: 10px 14px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
.plan { border-left: 3px solid var(--line); padding: 4px 0 4px 14px; margin-bottom: 16px; font-size: 14px; }
.plan ul { margin: 6px 0 12px; padding-left: 18px; font-family: var(--mono); font-size: 13px; }
.diff-file { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
.diff-file > summary { list-style: none; cursor: pointer; padding: 8px 14px; display: flex; gap: 10px; align-items: baseline; border-bottom: 1px solid var(--line); background: var(--side); }
.diff-file:not([open]) > summary { border-bottom: 0; }
.diff-file > summary::-webkit-details-marker { display: none; }
.diff-file .path { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.diff-file .share { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.st { font-family: var(--mono); font-size: 12px; font-weight: 700; width: 1ch; }
.st.A { color: var(--add-text); } .st.D { color: var(--del-text); } .st.M, .st.R { color: var(--likely); }
.diff { overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; }
.hunk-head { display: flex; gap: 10px; align-items: center; padding: 4px 14px; color: var(--hunk); background: var(--code-bg); white-space: pre; }
.hunk-head .comment-btn { margin-left: auto; font-family: var(--sans); }
.badge { font-family: var(--sans); font-size: 11px; border: 1px solid currentColor; border-radius: 10px; padding: 0 7px; }
.badge.recorded { color: var(--recorded); } .badge.sure { color: var(--sure); } .badge.likely { color: var(--likely); } .badge.maybe { color: var(--maybe); }
.l { white-space: pre; padding: 0 14px; min-width: max-content; }
.l.add { background: var(--add-bg); color: var(--add-text); }
.l.del { background: var(--del-bg); color: var(--del-text); }
.comment { font-family: var(--sans); font-size: 14px; padding: 8px 14px; border-top: 1px dashed var(--line); background: var(--accent-soft); display: flex; gap: 8px; align-items: flex-start; white-space: pre-wrap; }
.comment textarea { flex: 1; min-height: 56px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); padding: 6px 8px; }
.comment .text { flex: 1; overflow-wrap: anywhere; }
.more { padding: 4px 14px; color: var(--muted); font-size: 12px; }
.legend { color: var(--muted); font-size: 12px; margin-top: 24px; display: flex; flex-wrap: wrap; gap: 4px 16px; }

/* ---------------------------------------------------------------- a new session */
.form { display: grid; gap: 14px; margin-top: 18px; max-width: 640px; }
.form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.form input:not([type="radio"]):not([type="checkbox"]), .form select, .form textarea { font: inherit; font-size: 15px; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.form textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
.form .seg, .form .check { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 14px; color: var(--text); }
.form .seg label, .form .check label { display: flex; gap: 6px; align-items: center; color: var(--text); font-size: 14px; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form .check input:not([type="checkbox"]) { flex: 1; min-width: 160px; }
.chip-sel { flex: none; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 8px; font-size: 13px; color: var(--muted); }

/* ---------------------------------------------------------------- activity */
.feed { list-style: none; margin: 18px 0 0; padding: 0; }
.feed .day { font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
.ev { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; font-size: 14px; }
.ev .t { flex: none; width: 3em; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.ev .mark { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--line); transform: translateY(-1px); }
.ev.urgent .mark { background: var(--urgent); } .ev.turn .mark { background: var(--accent); } .ev.ok .mark { background: var(--ok); }
.ev .what { min-width: 0; overflow-wrap: anywhere; }

/* ---------------------------------------------------------------- clean up, remote */
.page-head h2 { margin: 0 0 4px; font-size: 20px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.page-sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.block { margin-top: 22px; }
table.clean { width: 100%; border-collapse: collapse; font-size: 14px; }
table.clean td, table.clean th { text-align: left; padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.clean th { font-size: 12px; color: var(--muted); font-weight: 600; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wt { padding: 10px 0; border-bottom: 1px solid var(--line); }
.pair { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 14px; }
.pair .qr { width: 200px; height: 200px; background: #fff; padding: 6px; border-radius: 8px; }
.pair .qr svg { width: 100%; height: 100%; }
.pair p { margin: 0 0 8px; font-size: 14px; }

/* ---------------------------------------------------------------- the passkey check before acting */
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--text); padding: 20px; width: min(92vw, 380px); }
dialog::backdrop { background: rgba(0, 0, 0, .4); }
dialog h2 { margin: 0 0 6px; font-size: 17px; }
dialog p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }

/* ---------------------------------------------------------------- layouts: the switch, cards, Deck, Grid, Pop out */
.layout-root { display: none; flex: 1; min-height: 0; overflow: auto; }
body:not([data-layout="focus"]) .app { display: none; }
body:not([data-layout="focus"]) .layout-root { display: block; }
.card { display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); }
.card.s-needs-answer { border-color: var(--urgent); }
.card-head { display: flex; gap: 8px; align-items: center; padding: 10px 12px 2px; min-width: 0; }
.card-title { flex: 1; min-width: 0; border: 0; background: none; padding: 0; font: inherit; font-weight: 650; text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.card-title:hover { color: var(--accent); }
.card-head .age { color: var(--faint); font-size: 12px; white-space: nowrap; }
.card-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 0 12px 8px; font-size: 12px; color: var(--muted); }
.card-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px; font-size: 14px; border-top: 1px solid var(--line); overscroll-behavior: contain; }
.card-body .msg { margin: 8px 0; }
.card-body .bubble { max-width: 92%; padding: 6px 11px; border-radius: 14px 14px 5px 14px; }
.card-body .md { line-height: 1.6; }
.card-body .md pre.code { font-size: 11.5px; }
.card-body .event, .card-body .when { margin: 8px 0; }
.card-steps { font-size: 12px; color: var(--faint); margin: 4px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-ask { padding: 8px 12px; border-top: 1px solid var(--line); }
.card-ask:empty { display: none; }
.card-ask .choices { margin-top: 6px; }
.card-ask .choice { padding: 7px 10px; font-size: 13px; }
.card-reply { padding: 8px 10px 10px; border-top: 1px solid var(--line); }
.card-quick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 6px; }
.card-quick:empty { display: none; }
.card-form { display: flex; gap: 6px; }
.card-input { flex: 1; min-width: 0; resize: none; line-height: 1.4; max-height: 30vh; font: inherit; font-size: 14px; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.card-input:focus { outline: none; border-color: var(--accent); }
.card-note { margin: 4px 2px 0; font-size: 12px; color: var(--muted); }
.card-note:empty { display: none; }
.deck-cols { display: flex; gap: 12px; padding: 12px; height: 100%; overflow-x: auto; scroll-snap-type: x proximity; }
.deck-cols > .card { flex: none; width: 380px; height: 100%; scroll-snap-align: start; }
.grid-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; padding: 12px; align-content: start; }
.grid-tiles > .card { height: 360px; }
.layout-empty { color: var(--muted); padding: 48px 16px; text-align: center; }
body.pip { height: auto; min-height: 100vh; overflow: auto; display: block; }
.pip-head { display: flex; gap: 10px; align-items: baseline; padding: 10px 12px 0; font-size: 14px; }
.mini-list { display: grid; gap: 8px; padding: 8px; }
.card.mini .card-body { flex: none; max-height: 4.6em; overflow: hidden; font-size: 13px; }
.card.mini .card-head { padding-top: 8px; }

/* ---------------------------------------------------------------- touch */
@media (pointer: coarse) {
  .btn, .tbtn { min-height: 36px; }
  .key, .opt, .chip-btn { min-height: 40px; }
  .choice { padding: 12px 14px; }
  .session { padding-top: 10px; padding-bottom: 11px; }
  .entry { padding: 9px 8px; }
  .tabs button { padding: 10px 12px 11px; }
}

/* ---------------------------------------------------------------- phone: a list, then a session */
@media (max-width: 699px) {
  header#top { padding: 8px 16px; gap: 6px 10px; }
  .summary .optional, .tools .optional { display: none; }
  .tools { margin-left: 0; width: 100%; }
  .app { grid-template-columns: minmax(0, 1fr); }
  nav#nav { border-right: 0; }
  body[data-view="list"] main#main { display: none; }
  body[data-view="session"] nav#nav, body[data-layout="focus"][data-view="session"] header#top { display: none; }
  .deck-cols { scroll-snap-type: x mandatory; padding: 8px; gap: 8px; }
  .deck-cols > .card { width: calc(100vw - 16px); }
  .grid-tiles { grid-template-columns: minmax(0, 1fr); padding: 8px; gap: 8px; }
  .grid-tiles > .card { height: auto; max-height: 75vh; }
  body.special main#main { grid-column: auto; }
  .back { display: inline-flex; }
  .shead { padding: 8px 10px 2px 16px; }
  .new-btn .lbl { display: none; }
  .new-btn { padding: 4px 8px; }
  .shead h2 { font-size: 17px; }
  .meta .path { display: none; }
  .actions { margin-top: 8px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .actions .btn { padding: 3px 11px; font-size: 13px; }
  .tabs-row { padding: 0 10px; }
  .col { padding: 14px 16px 32px; }
  .dock .col { padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); }
  .bubble { max-width: 88%; }
  .msg.ai { padding-right: 0; }
  .keys { display: none; }
  .ranges { margin-left: 0; }
  .sec { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body data-view="list" data-layout="focus">
<header id="top">
  <h1>Agent Deck</h1>
  <div class="summary" id="summary"></div>
  <div class="tools">
    <span class="limits optional" id="limits"></span>
    <div class="seg" id="layouts" role="group" aria-label="Layout"></div>
    <button class="btn primary new-btn" id="new" title="Start Claude Code or Codex in a new herdr tab"><span data-icon="plus"></span><span class="lbl">New session</span></button>
    <button class="icon-btn" id="activity" title="Activity: what happened in every session" aria-label="Activity" data-icon="activity"></button>
    <button class="icon-btn" id="notify" aria-pressed="false" title="Notifications when a session waits on you, also with the page closed" aria-label="Notifications" data-icon="bell"></button>
    <details class="menu" id="more"><summary class="icon-btn" title="More" aria-label="More" data-icon="more"></summary><div class="menu-list">
      <button id="cleanup" data-icon="broom" title="Idle sessions and worktrees nobody uses">Clean up</button>
      <button id="remote" data-icon="phone" title="Use this page from your phone">Remote: your phone</button>
      <div class="menu-note" id="updated"></div>
    </div></details>
  </div>
</header>
<div class="app" id="app">
  <nav id="nav" aria-label="Sessions"><div class="nav-empty">Looking for sessions…</div></nav>
  <main id="main">
    <div class="shead" id="head"></div>
    <div class="tabs-row" id="tabs-row"><div class="tabs" id="tabs" role="tablist"></div><div class="tab-meta" id="tab-meta"></div></div>
    <section class="pane" id="pane-chat">
      <div class="chat" id="chat"><div class="col" id="chat-col"></div></div>
      <div class="dock"><div class="col" id="dock"></div></div>
    </section>
    <section class="pane scroll" id="pane-changes" hidden><div class="col wide"><section id="changes" class="changes"></section></div></section>
    <section class="pane scroll" id="pane-files" hidden><div class="col wide" id="files"></div></section>
    <section class="pane scroll" id="pane-details" hidden></section>
    <section class="pane scroll" id="pane-special" hidden><div class="col" id="special"></div></section>
  </main>
  <aside id="side" aria-label="About this session"><div id="info"></div></aside>
</div>
<div class="layout-root" id="layout-root"></div>
<dialog id="confirm" aria-labelledby="confirm-title">
  <h2 id="confirm-title">Is it you?</h2>
  <p>From another device, sending to a session needs this device's passkey every few minutes.</p>
  <div class="actions"><button class="btn primary" id="confirm-go">Use the passkey</button><button class="btn" id="confirm-cancel">Cancel</button></div>
  <p class="note error" id="confirm-error"></p>
</dialog>
<script>
// iOS zooms into a text box on focus; telling it not to scale stops that, and on iOS pinching
// still zooms. Elsewhere the setting would take pinching away, so iOS only.
if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) document.querySelector('meta[name="viewport"]').content += ", maximum-scale=1";
/*@markdown*/
/*@passkey*/

// Agent Deck was agent-diff: what this browser kept moves over to the new keys, once.
try {
  for (const k of Object.keys(localStorage)) {
    if (!k.startsWith("agent-diff:")) continue;
    const to = "agent-deck:" + k.slice("agent-diff:".length);
    if (localStorage.getItem(to) === null) localStorage.setItem(to, localStorage.getItem(k));
    localStorage.removeItem(k);
  }
} catch {
  // storage blocked
}
const params = new URLSearchParams(location.hash.slice(1));
// The local page's token, kept for when it opens without it (from a home screen, or a notification).
const token = params.get("t") || (() => {
  try {
    return JSON.parse(localStorage.getItem("agent-deck:token") || '""');
  } catch {
    return "";
  }
})();
try {
  if (params.get("t")) localStorage.setItem("agent-deck:token", JSON.stringify(params.get("t")));
} catch {
  // storage blocked: the URL keeps carrying it
}
/** "remote": served through the tunnel to a device signed in with a passkey (no token, a cookie). */
const mode = (document.querySelector('meta[name="agent-deck-mode"]') || {}).content || "local";
let range = params.get("since") ? "since=" + encodeURIComponent(params.get("since")) : params.get("base") ? "base=" + encodeURIComponent(params.get("base")) : "";
let selected = params.get("s") || null;
let inbox = null; // running sessions, in every repository
let prev = null; // the inbox before, to notice sessions that start waiting
let home = null; // changes in the repository the page was started in (sessions that ended, unattributed)
let shown = {}; // what each part shows, to repaint only on change
const views = new Map(); // `${repo}|${range}` → { at, view }
const screens = new Map(); // session → its herdr screen, once asked for
const drafts = new Map(); // session → the prompt being written
const sending = new Set(); // sessions a prompt is on its way to: a second tap waits for the first
const moving = new Set(); // sessions being moved into herdr
let composing = false; // an IME is composing in the reply box: repainting it now would break that
const attached = new Map(); // session → files sent for its next prompt: [{ name, path }]
const ciLogs = new Map(); // pull request → why its CI failed: { loading } | { error } | { checks, log }
/** The failing log, as a request the session can act on. */
const ciText = (url, r) => `CI failed on ${url}${r.checks.length ? ` (${r.checks.map((c) => c.name).join(", ")})` : ""}. The end of the failing log:\n\n\`\`\`\n${r.log}\n\`\`\`\n\nFind the cause and fix it.`;
const TABS = ["chat", "changes", "files", "details"];
/** Phones show the list or a session; wide screens show the details beside the conversation. */
const phone = matchMedia("(max-width: 699px)");

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

const base = (p) => (p || "").split("/").filter(Boolean).pop() || "";

// Per-browser conveniences; the page works the same without storage.
function stored(key, fallback) {
  try {
    const v = localStorage.getItem("agent-deck:" + key);
    return v === null ? fallback : JSON.parse(v);
  } catch {
    return fallback;
  }
}
function store(key, value) {
  try {
    localStorage.setItem("agent-deck:" + key, JSON.stringify(value));
  } catch {
    // storage blocked
  }
}
const foldSaved = stored("fold", {});
const fold = { projects: new Set(foldSaved.projects || []), idle: new Set(foldSaved.idle || []), held: new Set(foldSaved.held || []) };
const saveFold = () => store("fold", { projects: [...fold.projects], idle: [...fold.idle], held: [...fold.held] });
const toggle = (set, k) => (set.has(k) ? set.delete(k) : set.add(k));

/** Ctrl+Enter sends (⌘+Enter on a Mac); Enter alone is a new line, and confirms a conversion while typing Japanese. */

const fine = matchMedia("(pointer: fine)");

const headers = () => ({ "content-type": "application/json", "x-agent-deck": "1", ...(token && { "x-token": token }) });
async function api(path, init = {}, again = false) {
  const res = await fetch(path, { ...init, headers: { ...headers(), ...init.headers }, credentials: "same-origin" });
  if (res.status === 401 && mode === "remote") {
    location.assign("/login"); // the session ended: sign in again
    throw new Error("Signing in again…");
  }
  const body = await res.json();
  // Acting from another device: check its passkey, then send again.
  if (res.status === 403 && body.confirm && !again) {
    await confirmIdentity();
    return api(path, init, true);
  }
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

const okJson = async (res) => {
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || res.statusText);
  return j;
};
let confirming = null; // the check in progress, shared by every request waiting on it

/** Asks for this device's passkey; a button starts it, since browsers want a tap for passkeys. */
function confirmIdentity() {
  if (confirming) return confirming;
  const dialog = $("confirm");
  confirming = new Promise((resolve, reject) => {
    $("confirm-error").textContent = "";
    dialog.showModal();
    const done = (settle, value) => {
      dialog.close();
      confirming = null;
      $("confirm-go").onclick = $("confirm-cancel").onclick = null;
      settle(value);
    };
    $("confirm-cancel").onclick = () => done(reject, new Error("Not sent: the passkey check was cancelled."));
    $("confirm-go").onclick = async () => {
      $("confirm-go").disabled = true;
      try {
        const send = (path, body) => fetch(path, { method: "POST", headers: headers(), credentials: "same-origin", body: JSON.stringify(body) }).then(okJson);
        const options = await send("/auth/confirm/options", {});
        const cred = await navigator.credentials.get({ publicKey: request(options) });
        await send("/auth/confirm/verify", { response: authentication(cred) });
        done(resolve);
      } catch (e) {
        $("confirm-error").textContent = e && e.name === "NotAllowedError" ? "Cancelled, or no passkey here. Try again." : e.message;
      } finally {
        $("confirm-go").disabled = false;
      }
    };
  });
  return confirming;
}
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body) });

async function loadInbox() {

    next = await api("/api/inbox");
  } catch (e) {
    $("nav").innerHTML = `<div class="nav-empty error">${esc(e.message)}</div>`;
    return;
  }
  prev = inbox;
  inbox = next;
  if (inbox.home && !home) await loadHome();
  notifyChanges();
  paint();
  if (selected === "activity") void paintActivity();
  openStarted();
  if (currentLayout !== "focus" || pip) void refreshCards();
  // What the selected session wrote since: cheap, only the new end of its transcript.

async function loadHome() {
  try {
    home = await view(inbox.home, true);
  } catch {
    home = null;
  }
}

async function view(repo, fresh = false) {
  const key = `${repo}|${range}`;
  const hit = views.get(key);
  if (hit && !fresh && Date.now() - hit.at < 5000) return hit.view;
  const v = await api(`/api/view?repo=${encodeURIComponent(repo)}&${range}`);
  views.set(key, { at: Date.now(), view: v });
  if (inbox && repo === inbox.home) home = v;
  return v;
}

/**
 * Everything the list shows: running sessions, then sessions that ended but left changes here.
 * `project` groups them (a repository's main checkout, worktrees included); `place` names the
 * worktree when it is not the main one.
 */
function entries() {
  const items = inbox ? inbox.items : [];
  const live = new Set(items.map((i) => i.key));
  const out = items.map((i) => ({ key: i.key, state: i.state, item: i, project: i.project || i.cwd || "", place: i.repo && i.repo !== i.project ? base(i.repo) : "" }));
  if (home) {
    const project = inbox.homeProject || home.root;
    const place = home.root !== project ? base(home.root) : "";
    for (const s of home.sessions) if (!live.has(s.key)) out.push({ key: s.key, state: "closed", session: s, project, place });
    if (home.unknown.length) out.push({ key: "unknown", state: "closed", project, place });
  }
  return out;
}
const entry = (key) => entries().find((e) => e.key === key);
const recency = (e) => (e.item ? e.item.since : e.session ? e.session.lastAt : 0);
const waiting = (i) => (i.state === "needs-answer" || i.state === "your-turn") && !i.hold;

/** Entries grouped by project: projects with the most urgent session first, then the most recent. */
function projects() {
  const map = new Map();
  for (const e of entries()) {
    let p = map.get(e.project);
    if (!p) map.set(e.project, (p = { key: e.project, name: base(e.project) || "(no folder)", list: [] }));
    p.list.push(e);
  }
  const rank = (e) => (e.item && e.item.hold ? 5 : ORDER[e.state]);
  const out = [...map.values()];
  for (const p of out) {
    p.list.sort((a, b) => rank(a) - rank(b) || recency(b) - recency(a));
    p.best = Math.min(...p.list.map(rank));
    p.recent = Math.max(...p.list.map(recency));
  }
  return out.sort((a, b) => a.best - b.best || b.recent - a.recent);
}

function pickDefault() {
  if (special()) return;
  const all = entries();
  if (selected && all.some((e) => e.key === selected)) return;
  const visible = all.filter((e) => !(e.item && e.item.hold));
  const first = visible.find((e) => e.state === "needs-answer") || visible.find((e) => e.state === "your-turn") || visible.find((e) => e.state !== "stale") || all[0];
  selected = first ? first.key : null;
}

// ------------------------------------------------------------ list

function snippet(e) {
  if (e.key === "unknown") return "Changes no session explains";
  if (e.session) return e.session.title || "(untitled)";
  const i = e.item;
  if (i.hold) return i.hold.kind === "later" && i.hold.until ? `later, until ${when(i.hold.until)}` : "done for now";
  if (i.state === "needs-answer") return (i.questions && i.questions[0] && i.questions[0].question) || i.reason || "input needed";
  if (i.state === "working") return (i.reason && i.reason !== "background command" ? i.reason : i.background && i.background[0] && i.background[0].command) || i.reason || (i.tasks && (i.tasks.find((t) => t.status === "in_progress") || {}).activeForm) || "working…";
  return plain(lastLine(i.awaySummary || i.lastMessage)) || "(no reply yet)";
}

/** The worst CI state among a session's open pull requests. */
function prState(i) {
  const st = (i.prs || []).map((p) => inbox.prStatus && inbox.prStatus[p.url]).filter((s) => s && s.state === "OPEN");
  return st.some((s) => s.ci === "failing") ? "failing" : st.some((s) => s.ci === "pending") ? "pending" : st.some((s) => s.ci === "passing") ? "passing" : "";
}

function contextLevel(c) {
  if (!c || c.tokens === undefined) return "";
  const limit = c.window || c.lastCompactTokens;
  if (!limit) return "";
  const r = c.tokens / limit;
  return r >= (c.window ? 0.8 : 0.9) ? "full" : r >= 0.6 ? "warn" : "";
}

function chips(i) {
  let html = "";
  if (i.asks) html += '<span class="chip ask" title="Its last reply ends with a question">?</span>';
  if (i.conflicts && i.conflicts.length) html += `<span class="chip conflict" title="Shares ${plural(i.conflicts.length, "file")} with another running session">⚠</span>`;
  const pr = prState(i);
  if (pr) html += `<span class="chip ${pr}" title="Pull request CI: ${pr}">PR</span>`;
  if (i.tasks && i.tasks.length) html += `<span class="chip" title="Tasks done">${i.tasks.filter((t) => t.status === "completed").length}/${i.tasks.length}</span>`;
  if (contextLevel(i.context) === "full") html += '<span class="chip ctx" title="Context nearly full">ctx</span>';
  return html;
}

function row(e) {
  const i = e.item;
  const name = i ? nameOf(i) : e.key === "unknown" ? "Unattributed" : e.session.title || e.session.id.slice(0, 8);
  const agent = i ? i.agent : e.session ? e.session.agent : "";
  const right = i ? age(i.since) : e.session ? plural(e.session.files.length, "file") : plural(home.unknown.length, "file");
  return `<button class="session" data-key="${esc(e.key)}" aria-current="${e.key === selected}">
    <div class="row1"><span class="dot ${e.state}"></span><span class="name">${esc(name)}</span>${i ? chips(i) : ""}<span class="age">${esc(right)}</span></div>
    <div class="row2">${agent ? `<span class="agent ${agent}">${agentName(agent)}</span>` : ""}${e.place ? `<span class="where">${esc(e.place)}</span>` : ""}<span class="snip">${esc(snippet(e))}</span></div></button>`;
}

function paintNav() {
  const hours = inbox ? Math.round(inbox.staleAfter / 36e5) : 24;
  const over = hours % 24 === 0 ? `${hours / 24}d` : `${hours}h`;
  let html = "";
  for (const p of projects()) {
    const held = p.list.filter((e) => e.item && e.item.hold);
    const rest = p.list.filter((e) => !(e.item && e.item.hold));
    const count = (state) => rest.filter((e) => e.state === state).length;
    const [answer, turn, working, idle] = [count("needs-answer"), count("your-turn"), count("working"), count("stale")];
    const open = !fold.projects.has(p.key);
    let counts = "";
    if (answer) counts += `<span class="c needs-answer" title="Needs an answer">${answer}</span>`;
    if (turn) counts += `<span class="c your-turn" title="Your turn">${turn}</span>`;
    if (working) counts += `<span class="c other">${working} working</span>`;
    if (!counts && idle && idle === rest.length) counts = `<span class="c other">${idle} idle</span>`;
    html += `<button class="project" data-project="${esc(p.key)}" aria-expanded="${open}" title="${esc(p.key)}"><span class="chev">${open ? "▾" : "▸"}</span><span class="pname">${esc(p.name)}</span><span class="counts">${counts}</span></button>`;
    if (!open) continue;
    html += rest.filter((e) => e.state !== "stale").map(row).join("");
    const stale = rest.filter((e) => e.state === "stale");
    for (const [list, set, what] of [[held, fold.held, "on hold"], [stale, fold.idle, `idle for over ${over}`]]) {
      if (!list.length) continue;
      const shownList = set.has(p.key) || list.some((e) => e.key === selected);
      html += `<button class="fold" data-fold="${what === "on hold" ? "held" : "idle"}" data-project="${esc(p.key)}" aria-expanded="${shownList}">${shownList ? "▾" : "▸"} ${list.length} ${what}</button>`;
      if (shownList) html += list.map(row).join("");
    }
  }
  if (!html) html = `<div class="nav-empty">${inbox ? "No running sessions." : "Looking for sessions…"}</div>`;
  html += `<div class="keys"><kbd>↑</kbd> <kbd>↓</kbd> or <kbd>j</kbd> <kbd>k</kbd> to move</div>`;
  if (html === shown.nav) return;
  shown.nav = html;
  const scroll = $("nav").scrollTop;
  $("nav").innerHTML = html;
  $("nav").scrollTop = scroll;
}

function paintHeader() {
  const items = inbox ? inbox.items.filter((i) => !i.hold) : [];
  const of = (s) => items.filter((i) => i.state === s).length;
  const answer = of("needs-answer");

  const working = of("working");
  const parts = [];
  if (answer) parts.push(`<span class="urgent"><b>${answer}</b> need${answer === 1 ? "s" : ""} an answer</span>`);
  if (turn) parts.push(`<span><b>${turn}</b> your turn</span>`);

  const l = inbox && inbox.codexLimits;

// ------------------------------------------------------------ notifications

/** Sessions that started waiting since the last look (the same rule as `agent-deck inbox --watch`). */
function notifyChanges() {
  if (pushOn || !notifyOn || !prev || !inbox) return; // pushed by the server instead
  const before = new Map(prev.items.map((i) => [i.key, i]));
  for (const i of inbox.items) {
    if (!waiting(i)) continue;
    const b = before.get(i.key);
    if (b && waiting(b) && b.state === i.state && b.since === i.since) continue;
    const title = i.state === "needs-answer" ? `${nameOf(i)} needs an answer` : `${nameOf(i)}: your turn`;
    const body = i.state === "needs-answer" ? (i.questions && i.questions[0] && i.questions[0].question) || i.reason || "input needed" : lastLine(i.lastMessage) || "Finished its turn.";
    try {
      const n = new Notification(title, { body, tag: i.key });
      n.onclick = () => {
        window.focus();
        openSession(i.key);
        n.close();
      };
    } catch {
      // notifications not available here
    }
  }
}

/**
 * Notifications pushed by the server, which come with the page closed (on iPhone, to the app
 * added to the home screen); else the page's own, while it is open.
 */
const canPush = "serviceWorker" in navigator && "PushManager" in window && (mode === "remote" || !!token);
let pushOn = false;

async function initPush() {
  if (!canPush) return;
  try {
    const reg = await navigator.serviceWorker.register("/sw.js");
    pushOn = !!(await reg.pushManager.getSubscription());
    paintHeader();
  } catch {
    // no worker here (an insecure origin, a private window)
  }
}
if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", (ev) => ev.data && ev.data.open && openSession(ev.data.open));

async function togglePush() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const current = await reg.pushManager.getSubscription();
    if (pushOn && current) {
      await post("/api/push/unsubscribe", { endpoint: current.endpoint });
      await current.unsubscribe();
      pushOn = false;
    } else {
      if ((await Notification.requestPermission()) !== "granted") throw new Error("Notifications are blocked for this page; allow them in the browser's settings.");
      const { key } = await api("/api/push");
      const sub = current || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64.toBytes(key) }));
      await post("/api/push/subscribe", { subscription: sub.toJSON() });
      pushOn = true;
      await post("/api/push/test", {});
    }
  } catch (e) {
    alert(e.message);
  }
  paintHeader();
}

$("notify").onclick = async () => {
  if (canPush) return void togglePush();
  if (/iPhone|iPad/.test(navigator.userAgent)) return alert("On iPhone and iPad, notifications come to the app on the home screen: tap Share, then Add to Home Screen, open Agent Deck from there, and tap Notify.");
  if (typeof Notification === "undefined") return alert("This browser has no notifications.");
  if (!notifyOn && Notification.permission !== "granted") {
    if ((await Notification.requestPermission()) !== "granted") return;
  }
  notifyOn = !notifyOn;
  store("notify", notifyOn);
  paintHeader();
};

// ------------------------------------------------------------ session head and tabs

function paintHead(e) {
  const i = e && e.item;
  const key = JSON.stringify(e ? { k: e.key, s: e.state, i: i && [i.title, i.name, i.cwd, i.since, i.jobId, i.herdr, i.hold, i.agent, i.model, Math.round((i.memory || 0) / 5e7)], x: e.session && e.session.lastAt } : null);
  if (key === shown.head) return;
  shown.head = key;
  const back = `<button class="icon-btn back" data-act="back" aria-label="Back to the sessions">${icon("back", 22)}</button>`;
  const head = (title, pills = "", actions = "") => `<div class="shead-row">${back}<h2 title="${esc(title)}">${esc(title)}</h2>${pills}<div class="head-actions">${actions}</div></div><span class="note" id="act-note"></span>`;
  if (!e) {
    $("head").innerHTML = head(inbox ? "No running sessions" : "Looking for sessions…");
    $("tab-meta").innerHTML = "";
    return;
  }
  if (e.key === "unknown") {
    $("head").innerHTML = head("Unattributed");
    $("tab-meta").innerHTML = `<span>Edited by hand, by a tool, or by a session older than the transcripts read</span>`;
    return;
  }
  if (e.session) {
    const s = e.session;
    $("head").innerHTML = head(s.title || "(untitled)", `<span class="pill">Not running</span>`);
    $("tab-meta").innerHTML = `<span class="agent ${s.agent}">${agentName(s.agent)}</span><span>${when(s.firstAt)} – ${when(s.lastAt)}</span>`;
    return;
  }
  const held = i.hold ? `<span class="pill">${i.hold.kind === "later" && i.hold.until ? `Later, until ${esc(when(i.hold.until))}` : "Done for now"}</span>` : "";
  let actions = "";
  if (i.hold) actions += `<button class="icon-btn" data-act="release" title="Back on the list" aria-label="Back on the list">${icon("undo")}</button>`;
  else if (waiting(i) || i.state === "stale")
    actions += `<details class="menu"><summary class="icon-btn" title="Later: off the list for a while" aria-label="Later">${icon("clock")}</summary><div class="menu-list"><button data-act="later" data-until="1h">${icon("clock")}For an hour</button><button data-act="later" data-until="tomorrow">${icon("clock")}Until tomorrow</button></div></details><button class="icon-btn" data-act="done" title="Done: off the list until it does something new" aria-label="Done">${icon("check")}</button>`;
  if (i.herdr) actions += `<button class="icon-btn" data-act="focus" title="Go to its pane, on this computer" aria-label="Go to its pane">${icon("goto")}</button>`;
  $("head").innerHTML = head(nameOf(i), `<span class="pill ${i.state}">${STATE[i.state]}</span>${held}`, actions);
  $("tab-meta").innerHTML = [
    `<span class="agent ${i.agent}">${agentName(i.agent)}</span>`,
    i.model ? `<span title="Model">${esc(i.model)}</span>` : "",
    `<span title="${esc(new Date(i.since).toLocaleString())}">${ago(i.since)}</span>`,
    i.herdr ? `<span title="Its herdr pane">${esc(i.herdr.pane)} · ${esc(i.herdr.status)}</span>` : "",
  ].join("");
}

function paintTabs(e) {
  const changes = e && e.item && e.item.conflicts && e.item.conflicts.length ? `<span class="n">⚠</span>` : "";
  const list = [["chat", "Conversation"], ["changes", "Changes" + changes], ["files", "Files"]];
  if (!wide.matches) list.push(["details", "Details"]);
  const html = list.map(([k, label]) => `<button role="tab" data-tab="${k}" aria-selected="${tab === k}">${label}</button>`).join("");
  if (html !== shown.tabs) $("tabs").innerHTML = shown.tabs = html;
}

/** Which part shows, and where the details go: beside the conversation, or in their own tab. */
function layout() {
  const sp = special();
  document.body.classList.toggle("special", sp);
  if (wide.matches && tab === "details") tab = "chat";
  for (const t of TABS) $("pane-" + t).hidden = sp || tab !== t;
  $("pane-special").hidden = !sp;
  $("head").hidden = $("tabs-row").hidden = sp;
  const slot = wide.matches ? $("side") : $("pane-details");
  if ($("info").parentNode !== slot) slot.appendChild($("info"));
}

// ------------------------------------------------------------ conversation

const newChat = (key) => ({ key, messages: [], before: undefined, end: 0, state: key ? "loading" : "none", error: "", busy: false, open: new Set() });
let chat = newChat(null);

/** The latest page, an earlier one, or what was written since. */
async function loadChat(kind) {
  const c = chat;
  if (!c.key || c.busy || (kind === "earlier" && c.before === undefined)) return;
  c.busy = true;
  try {
    let q = `/api/chat?key=${encodeURIComponent(c.key)}`;
    if (kind === "earlier") q += `&before=${c.before}`;
    if (kind === "newer") q += `&after=${c.end}`;
    const page = await api(q);
    if (chat !== c) return; // another session was picked meanwhile
    if (page.reset) {
      chat = newChat(c.key);
      return void loadChat("latest");
    }
    if (kind === "latest") {
      Object.assign(c, { messages: page.messages, before: page.before, end: page.end, state: "ready" });
      paintChat("bottom");
    } else if (kind === "earlier") {
      c.messages = page.messages.concat(c.messages);
      c.before = page.before;
      paintChat("keep");
    } else {
      c.end = page.end;
      if (page.messages.length) {
        c.messages = c.messages.concat(page.messages);
        paintChat("follow");
      }
    }
  } catch (err) {
    if (chat !== c || kind !== "latest") return;
    c.state = "error";
    c.error = err.message;
    paintChat();
  } finally {
    c.busy = false;
  }
}

function syncChat(e) {
  const key = e && e.item ? e.key : null;
  if (chat.key === key && (key || chat.state === "none")) {
    if (key === null) paintChat(); // a closed session or none: say so
    return;
  }
  chat = newChat(key);
  paintChat();
  if (key) void loadChat("latest");
}

function paintChat(scroll) {
  const box = $("chat");
  const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 80;
  const height = box.scrollHeight;
  const top = box.scrollTop;
  $("chat-col").innerHTML = chatHtml();
  if (scroll === "bottom" || (scroll === "follow" && atEnd)) box.scrollTop = box.scrollHeight;
  else if (scroll === "keep") box.scrollTop = top + (box.scrollHeight - height);
}

function chatHtml() {
  const c = chat;
  const e = entry(selected);
  if (!c.key) {
    if (e && (e.session || e.key === "unknown")) return `<div class="empty">This session is not running; its changes are under <button class="linkish" data-tab="changes">Changes</button>.</div>`;
    return `<div class="empty">${inbox ? "Pick a session." : "Looking for sessions…"}</div>`;
  }
  if (c.state === "loading") return `<div class="empty">Reading the conversation…</div>`;
  if (c.state === "error") return `<div class="empty error">${esc(c.error)}</div>`;
  let html = c.before !== undefined ? `<div class="earlier"><button class="btn small" data-act="earlier">Earlier messages</button></div>` : `<div class="start">The start of the conversation</div>`;
  let steps = [];
  let lastAt = 0;
  const flush = (last) => {
    if (steps.length) html += stepsHtml(steps, last);
    steps = [];
  };
  for (const m of c.messages) {
    if (m.role === "tool") {
      steps.push(m);
      if (m.at) lastAt = m.at;
      continue;
    }
    flush(false);
    if (m.at && m.role === "user" && (!lastAt || m.at - lastAt > 20 * 6e4 || new Date(m.at).toDateString() !== new Date(lastAt).toDateString())) html += `<div class="when">${esc(when(m.at))}</div>`;
    if (m.at) lastAt = m.at;
    html += msgHtml(m);
  }
  flush(true);
  if (!c.messages.length) html += `<div class="empty">Nothing said yet.</div>`;
  return html;
}

function msgHtml(m) {
  const t = m.at ? ` title="${esc(new Date(m.at).toLocaleString())}"` : "";
  const cut = m.truncated ? `<div class="sub">… cut here; the rest is in the transcript.</div>` : "";
  if (m.role === "user") {
    const text = m.text || "";
    const long = text.length > 700 || text.split("\n").length > 12;
    const body = m.kind === "command" || m.kind === "shell" ? `<code>${esc(text)}</code>` : linkify(text);
    return `<div class="msg me${m.kind ? " " + esc(m.kind) : ""}"${t}><div class="bubble${long ? " long" : ""}">${body}${cut}</div>${long ? '<button class="linkish more-btn" data-act="expand">Show all</button>' : ""}</div>`;
  }
  if (m.role === "assistant") return `<div class="msg ai"${t}><div class="md">${markdown(m.text)}</div>${cut}</div>`;
  if (m.kind === "recap") return `<div class="recap"${t}><div class="label">While you were away</div><div class="md">${markdown(m.text)}</div></div>`;
  if (m.kind === "summary") return `<details class="event-box"${t}><summary>The conversation before, summarized</summary><div class="md">${markdown(m.text)}</div></details>`;
  if (m.kind === "output") return `<details class="event-box"${t}><summary>Output</summary><pre><code>${esc(m.text)}</code></pre></details>`;
  return `<div class="event${m.kind === "interrupted" ? " warn" : ""}"${t}>${esc(m.text)}</div>`;
}

/** A run of tool calls as one line that opens into the list; the last run shows its latest step. */
function stepsHtml(steps, last) {
  const id = steps[0].id;
  const counts = new Map();
  for (const s of steps) counts.set(s.tool, (counts.get(s.tool) || 0) + 1);
  const names = [...counts].sort((a, b) => b[1] - a[1]).slice(0, 4).map(([n, k]) => (k > 1 ? `${n} ×${k}` : n)).join(" · ");
  const failed = steps.filter((s) => s.error).length;
  const latest = steps[steps.length - 1];
  const step = (s) => {
    const d = s.detail ? (s.path ? `<a href="#" class="file" data-file="${esc(s.path)}">${esc(s.detail)}</a>` : esc(s.detail)) : "";
    return `<li class="step${s.error ? " failed" : ""}"><span class="tname">${esc(s.tool)}</span><span class="tdetail">${d}</span></li>`;
  };
  return `<details class="steps" data-group="${esc(id)}"${chat.open.has(id) ? " open" : ""}><summary><span class="count">${plural(steps.length, "step")}</span><span class="names">${esc(names)}</span>${failed ? `<span class="failed">${failed} failed</span>` : ""}${last && latest.detail ? `<span class="latest">${esc(latest.tool)}: ${esc(latest.detail)}</span>` : ""}</summary><ol>${steps.map(step).join("")}</ol></details>`;
}

// ------------------------------------------------------------ dock: answering through herdr

/** Can be closed where it runs and opened again in herdr (see move.ts). */
const movable = (i) => !!(inbox && inbox.herdrRunning && i.pid && !i.herdr && !i.terminal && i.kind !== "bg" && (i.agent === "claude" || i.agent === "codex"));
/** Why a running session cannot get replies from the page. */
const whyOutside = (i) =>
  i.terminal ? "its herdr pane shows another session now" : i.kind === "bg" ? "it runs as a Claude Code background session, outside herdr" : `it runs in ${esc(i.runsIn || "another terminal")}, outside herdr`;

/** Why the page cannot reply to a session outside herdr, and the way to bring it in. */
function outsideHtml(i) {
  const where = esc(i.runsIn || "another terminal");
  if (i.terminal) return `<div class="outside"><p><b>No replies from here:</b> ${whyOutside(i)}. Switch back to it in that pane, and the page can reply again.</p></div>`;
  if (i.kind === "bg") return `<div class="outside"><p><b>No replies from here:</b> ${whyOutside(i)}. Open it in a terminal with Claude Code to answer it.</p></div>`;
  let html = `<div class="outside"><p><b>No replies from here:</b> the page types into sessions through herdr, and this one runs in ${where}.</p>`;
  if (moving.has(i.key)) html += `<p class="sub">Moving it into herdr…</p>`;
  else if (movable(i) && i.state === "your-turn") html += `<p><button class="btn primary" data-act="move">${icon("goto", 16)}<span>Continue in herdr</span></button></p><p class="sub">It closes in ${where} and opens again in a new herdr tab, with the same conversation.</p>`;
  else if (movable(i)) html += `<p class="sub">${i.state === "working" ? "Once it finishes this turn" : `Once you answer it in ${where}`}, you can move it into herdr from here.</p>`;
  else if (!inbox.herdrRunning) html += `<p class="sub">Start <a href="https://herdr.dev" target="_blank" rel="noopener">herdr</a> on that computer to move it there.</p>`;
  html += `<p class="sub">Or go back to it there: <code class="cmd">${esc(i.resume)}</code> <button class="btn small" data-copy="${esc(i.resume)}">Copy</button></p></div>`;
  return html;
}

/** After a move: the session shows up again from its herdr pane, under the same key. */
async function untilInHerdr(key) {
  for (const until = Date.now() + 90_000; Date.now() < until; ) {
    await new Promise((r) => setTimeout(r, 1500));
    await loadInbox();
    const e = entry(key);
    if (e && e.item && e.item.herdr) return true; // the page shows it from herdr now, if you are still on it
  }
  return false;
}

function paintDock(e) {
  const i = e && e.item;
  const key = i ? JSON.stringify([i.key, i.state, !!i.herdr, i.reason, i.questions, i.plan, i.hold, quick, attached.get(i.key), i.runsIn, !!i.pid, inbox.herdrRunning, moving.has(i.key)]) : e ? e.key : "";
  if (key === shown.dock) return;
  // Mid-composition (Japanese, say), wait for it to end: see compositionend.
  if (composing && document.activeElement && document.activeElement.id === "prompt") return;
  shown.dock = key;
  const typing = document.activeElement && document.activeElement.id === "prompt" ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
  let html = "";
  if (i && i.state === "needs-answer") html += askHtml(i);
  if (i && i.herdr && i.state !== "needs-answer") {
    if (i.state === "your-turn" && !i.hold) {
      // Claude Code switches model and effort with its own commands.
      const switches = i.agent === "claude" ? `<span class="lbl">Model</span>${["fable", "opus", "sonnet", "haiku"].map((m) => `<button class="chip-btn" data-slash="/model ${m}">${m}</button>`).join("")}<span class="lbl">Effort</span>${EFFORTS.map((m) => `<button class="chip-btn" data-slash="/effort ${m}">${m}</button>`).join("")}` : "";
      if (quick.length) html += `<div class="quick">${quick.map((q) => `<button class="chip-btn" data-quick="${esc(q)}">${esc(q)}</button>`).join("")}</div>`;
      html += `<div class="tune-panel" id="tune-panel"${tuneOpen ? "" : " hidden"}>${switches}<button class="chip-btn ghost" data-act="edit-quick">${quick.length ? "Change one-tap replies" : "Add one-tap replies"}</button></div>`;
    }
    const tune = i.state === "your-turn" && !i.hold ? `<button class="icon-btn" data-act="tune" aria-expanded="${tuneOpen}" aria-pressed="${tuneOpen}" aria-controls="tune-panel" title="${i.agent === "claude" ? "Model, effort and one-tap replies" : "One-tap replies"}" aria-label="${i.agent === "claude" ? "Model, effort and one-tap replies" : "One-tap replies"}">${icon("tune")}</button>` : "";
    const stop = i.state === "working" ? `<button class="icon-btn" data-key-press="esc" title="Stop it (Esc)" aria-label="Stop">${icon("stop")}</button>` : "";
    const files = attached.get(i.key) || [];
    if (files.length) html += `<div class="attached">${files.map((f, n) => `<span class="att" title="${esc(f.path)}"><span class="nm">${esc(f.name)}</span><button data-unattach="${n}" aria-label="Do not send ${esc(f.name)}">×</button></span>`).join("")}</div>`;
    html += `<div class="composer"><button class="icon-btn" data-act="attach" title="Send files: photos, logs, documents" aria-label="Send files">${icon("plus", 20)}</button><input type="file" id="attach" multiple hidden>${tune}<textarea id="prompt" rows="1" aria-label="Message to the session" placeholder="${replyHint(i)}" title="${SEND_KEYS} sends">${esc(drafts.get(i.key) || "")}</textarea>${stop}<button class="send-btn" data-act="prompt" title="Send (${SEND_KEYS})" aria-label="Send">${icon("send")}</button></div>`;
    if (i.state === "working") html += `<p class="sub hint">It is working; your message waits in its queue.</p>`;
  } else if (i && !i.herdr && i.state !== "stale") {
    html += outsideHtml(i);
  }
  $("dock").parentElement.hidden = !html;
  $("dock").innerHTML = html + `<p class="note" id="answer-note"></p>`;
  // Repainted while you typed: go on typing where you were (on a phone, the keyboard stays up).
  if (typing && $("prompt")) {
    $("prompt").focus({ preventScroll: true });
    $("prompt").setSelectionRange(typing[0], typing[1]);
  }
  if ($("prompt")) grow($("prompt"));
  // What it asks, as its screen shows it.
  if (i && i.state === "needs-answer" && i.herdr && !screens.has(i.key)) void act("screen");
}

/**
 * What a waiting session asks: its plan when it wants one approved, the choices its dialog offers
 * (read off its screen, one tap each), and the keys and screen themselves, folded away when the
 * choices are there.
 */
function askHtml(i) {
  const seen = screens.get(i.key);
  const p = i.herdr && seen && seen.prompt;
  let html = `<div class="asking"><div class="asking-top"><span class="reason">${esc(i.reason || "input needed")}</span></div>`;
  if (i.plan) html += `<details class="plan-doc" open><summary>The plan</summary><div class="md">${markdown(i.plan)}</div></details>`;
  const questions = (i.questions || []).map((q) => q.question);
  if (p) {
    if (!questions.length && p.question) questions.push(p.question);
    html += questions.map((q) => `<div class="q">${esc(q)}</div>`).join("");
    html += `<div class="choices" data-sig="${esc(p.sig || "")}">${p.choices.map((c, n) => `<button class="choice${c.selected ? " selected" : ""}" data-choose="${n}" data-label="${esc(c.label)}"><span class="k">${c.key}</span><span>${esc(c.label)}</span></button>`).join("")}</div>`;
  } else {
    for (const q of i.questions || []) {
      html += `<div class="q">${esc(q.question)}</div>`;
      if (q.options.length) html += `<div class="opts">${q.options.map((o, n) => (i.herdr ? `<button class="opt" data-key-press="${n + 1}">${n + 1}. ${esc(o)}</button>` : `<span class="opt">${n + 1}. ${esc(o)}</span>`)).join("")}</div>`;
    }
  }
  if (i.herdr) {
    const keys = ["up", "down", "enter", "esc", "y", "n", "1", "2", "3", "4"];
    const names = { up: "↑", down: "↓", enter: "Enter", esc: "Esc" };
    html += `<details class="more-keys"${p && !keysOpen ? "" : " open"}><summary>Keys and its screen</summary><div class="keypad">${keys.map((k) => `<button class="key" data-key-press="${k}">${names[k] || k}</button>`).join("")}<button class="btn small" data-act="screen">Read it again</button></div><pre class="screen" id="screen">${esc(seen ? seen.text : "Reading its screen…")}</pre></details>`;
  }
  return html + `</div>`;
}

/** Fits the reply box to its text; measured only while it shows (hidden, it measures nothing). */
function grow(t) {
  if (!t.offsetParent) return void (t.style.height = "");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight + 2, Math.round(innerHeight * 0.35)) + "px";
}

// ------------------------------------------------------------ details

function paintInfo(e) {
  const i = e && e.item;
  const key = JSON.stringify(i ? [i.key, i.state, i.reason, i.tasks, i.background, i.prs && i.prs.map((p) => [p.url, (inbox.prStatus || {})[p.url], ciLogs.get(p.url)]), i.context, i.pages, i.conflicts, i.cwd, i.resume, i.memory && Math.round(i.memory / 5e7), i.jobId, !!i.herdr] : e ? e.key : null);
  if (key === shown.info) return;
  shown.info = key;
  if (!i) {
    $("info").innerHTML = e && e.session ? `<section class="sec"><h3>Session</h3><code class="cmd">${esc(e.session.id)}</code></section>` : "";
    return;
  }
  const sec = (title, body, cls = "") => `<section class="sec${cls}"><h3>${title}</h3>${body}</section>`;
  let html = "";
  if (i.conflicts && i.conflicts.length) {
