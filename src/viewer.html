    const other = (k) => {
      const o = inbox.items.find((x) => x.key === k);
      return `<button class="linkish" data-goto="${esc(k)}">${esc(o ? nameOf(o) : k.split(":")[1].slice(0, 8))}</button>`;
    };
    html += sec("Shared files", `<p class="note">Another running session has uncommitted changes in the same ${plural(i.conflicts.length, "file")}:</p><ul class="list">${i.conflicts.map((c) => `<li><code class="cmd">${esc(c.path)}</code> with ${c.with.map(other).join(", ")}</li>`).join("")}</ul><p class="sub">Staging with <code class="cmd">agent-deck add</code> keeps each session's hunks apart.</p>`, " warn");
  }
  if (i.reason && i.state !== "needs-answer") html += sec("Now", `<div>${esc(i.reason)}</div>`);
  if (i.tasks && i.tasks.length) {
    const done = i.tasks.filter((t) => t.status === "completed").length;
    const mark = { completed: "✓", in_progress: "▸", pending: "○" };
    html += sec(`Tasks <span class="n">${done}/${i.tasks.length}</span>`, `<div class="bar"><span style="width:${Math.round((done / i.tasks.length) * 100)}%"></span></div><ul class="tasks">${i.tasks.map((t) => `<li class="${esc(t.status)}"><span class="mark">${mark[t.status] || "○"}</span><span>${esc(t.status === "in_progress" && t.activeForm ? t.activeForm : t.subject)}</span></li>`).join("")}</ul>`);
  }
  if (i.background && i.background.length) {
    html += sec("In the background", `<ul class="list">${i.background
      .map((b) => {
        const long = Date.now() - b.since > 6 * 36e5;
        return `<li>${b.kind === "monitor" ? "Watching: " : ""}${esc(b.command)} <span class="sub${long ? " ci-pending" : ""}">running ${esc(age(b.since))}${long ? " — still needed?" : ""}</span></li>`;
      })
      .join("")}</ul>`);
  }
  if (i.prs && i.prs.length) {
    html += sec("Pull requests", `<ul class="list">${i.prs
      .map((p) => {
        const s = inbox.prStatus && inbox.prStatus[p.url];
        if (!s) return `<li><a href="${esc(p.url)}" target="_blank" rel="noopener">#${esc(p.number)}</a> <span class="sub">${esc(p.repo)} · looking it up…</span></li>`;
        const counts = [s.checks.failed && `${s.checks.failed} failed`, s.checks.pending && `${s.checks.pending} running`, s.checks.passed && `${s.checks.passed} passed`].filter(Boolean).join(", ");
        const ci = s.state !== "OPEN" ? s.state.toLowerCase() : s.ci === "none" ? "no checks" : `CI: ${counts}`;
        const extra = [s.draft ? "draft" : "", s.review ? s.review.toLowerCase().replace(/_/g, " ") : "", s.mergeState === "DIRTY" ? "has conflicts" : ""].filter(Boolean).join(" · ");
        const failing = s.state === "OPEN" && s.ci === "failing";
        const why = ciLogs.get(p.url);
        let more = "";
        if (failing && !why) more = ` <button class="linkish" data-ci="${esc(p.url)}">Why it failed</button>`;
        else if (why && why.loading) more = `<div class="sub">Reading the failing log…</div>`;
        else if (why && why.error) more = `<div class="note error">${esc(why.error)}</div>`;
        else if (why) {
          const text = ciText(p.url, why);
          more = `<div class="ci-log"><pre>${esc(why.log || "(no log of a failed GitHub Actions run)")}</pre><div class="actions">${i.herdr ? `<button class="btn small primary" data-ci-send="${esc(p.url)}">Send to the session</button>` : ""}<button class="btn small" data-copy="${esc(text)}">Copy</button></div></div>`;
        }
        return `<li><a href="${esc(p.url)}" target="_blank" rel="noopener">#${esc(p.number)}</a> ${esc(s.title)} <div class="sub"><span class="ci-${esc(s.ci)}">${esc(ci)}</span>${extra ? ` · ${esc(extra)}` : ""}${more && !more.startsWith("<div") ? more : ""}</div>${more.startsWith("<div") ? more : ""}</li>`;
      })
      .join("")}</ul>`);
  }
  if (i.pages && i.pages.length) {
    html += sec("Pages it published", `<ul class="list">${i.pages
      .slice()
      .reverse()
      .map((p) => `<li><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.title || p.url.replace(/^https?:\/\//, ""))}</a> <span class="sub">${esc(age(p.at))} ago</span></li>`)
      .join("")}</ul>`);
  }
  if (i.context) {
    const c = i.context;
    const limit = c.window || c.lastCompactTokens;
    const level = contextLevel(c);
    const what = c.tokens === undefined ? "unknown until its next request" : `${kTokens(c.tokens)} tokens${limit ? ` of ${c.window ? `a ${kTokens(c.window)} window` : `${kTokens(limit)} (where it last compacted)`}` : ""}`;
    html += sec("Context", `${limit && c.tokens !== undefined ? `<div class="bar ${level}"><span style="width:${Math.min(100, Math.round((c.tokens / limit) * 100))}%"></span></div>` : ""}<div class="sub">${esc(what)}${c.compactions ? ` · compacted ${c.compactions}×` : ""}${level === "full" ? " · nearly full: it will compact soon" : ""}</div>`);
  }
  const facts = [
    ["Agent", `${agentName(i.agent)}${i.model ? ` · ${esc(i.model)}` : ""}`],
    ["Since", `${esc(ago(i.since))}${i.herdr ? ` · herdr ${esc(i.herdr.pane)}` : ""}`],
    ["Folder", `<span class="path">${esc(i.cwd || "")}</span> <button class="linkish" data-open="">Browse</button>`],
    i.jobId ? ["Background", esc(i.jobId)] : null,
    i.memory ? ["Memory", `${Math.round(i.memory / 1e6)} MB`] : null,
  ].filter(Boolean);
  html += sec("Session", `<dl class="kv">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl><div class="actions"><code class="cmd">${esc(i.resume)}</code><button class="btn small" data-copy="${esc(i.resume)}">Copy</button></div>`);
  $("info").innerHTML = html;
}

// ------------------------------------------------------------ files

let files = { key: null, path: null, view: null, error: "", loading: false, img: "" };

/** Opens a folder or file of the selected session: "" is its own folder. */
async function openFiles(path) {
  const key = selected;
  if (files.img) URL.revokeObjectURL(files.img);
  files = { key, path, view: files.key === key ? files.view : null, error: "", loading: true, img: "" };
  paintFiles();
  try {
    const q = `?key=${encodeURIComponent(key)}&path=${encodeURIComponent(path)}`;
    const v = await api(`/api/files${q}`);
    let img = "";
    if (v.kind === "image") {
      const res = await fetch(`/api/files/image${q}`, { headers: headers(), credentials: "same-origin" });
      if (res.ok) img = URL.createObjectURL(await res.blob());
    }
    if (files.key !== key || files.path !== path) return;
    Object.assign(files, { view: v, loading: false, img });
  } catch (err) {
    if (files.key !== key || files.path !== path) return;
    Object.assign(files, { error: err.message, loading: false });
  }
  paintFiles();
  $("pane-files").scrollTop = 0;
}

function syncFiles(e) {
  if (!e || !e.item) {
    files = { key: null, path: null, view: null, error: "", loading: false, img: "" };
    $("files").innerHTML = `<div class="empty">Files are shown for running sessions.</div>`;
    return;
  }
  if (files.key !== e.key) void openFiles("");
}

const parentOf = (rel) => rel.split("/").slice(0, -1).join("/");
const under = (v, rel) => (rel ? `${v.root}/${rel}` : v.root);

function paintFiles() {
  const v = files.view;
  let html = "";
  if (v) {
    const parts = v.rel ? v.rel.split("/") : [];
    const crumbs = [`<button data-open="${esc(v.root)}" title="${esc(v.root)}">${esc(base(v.root))}</button>`];
    parts.forEach((p, n) => {
      const here = n === parts.length - 1;
      crumbs.push(`<span class="sep">/</span>${here ? `<span class="here">${esc(p)}</span>` : `<button data-open="${esc(under(v, parts.slice(0, n + 1).join("/")))}">${esc(p)}</button>`}`);
    });
    html += `<nav class="crumbs">${crumbs.join("")}</nav>`;
    if (v.kind !== "dir") html += `<div class="file-meta sub"><span>${bytes(v.size)}</span><span>changed ${esc(ago(v.mtime))}</span><button class="btn small" data-copy="${esc(under(v, v.rel))}">Copy path</button></div>`;
  }
  if (files.error) html += `<p class="note error">${esc(files.error)}</p>`;
  if (files.loading) html += `<p class="note">Opening…</p>`;
  else if (v && !files.error) html += v.kind === "dir" ? dirHtml(v) : fileHtml(v);
  $("files").innerHTML = html;
}

function dirHtml(v) {
  if (!v.entries.length) return `<p class="note">An empty folder.</p>`;
  const up = v.rel ? `<li><button class="entry folder" data-open="${esc(under(v, parentOf(v.rel)))}"><span class="ico">↰</span><span class="nm">..</span></button></li>` : "";
  return `<ul class="dir">${up}${v.entries
    .map((d) => `<li><button class="entry${d.dir ? " folder" : ""}" data-open="${esc(under(v, v.rel ? `${v.rel}/${d.name}` : d.name))}"><span class="ico">${d.dir ? "▸" : ""}</span><span class="nm">${esc(d.name)}${d.dir ? "/" : ""}</span>${d.size !== undefined ? `<span class="sz">${bytes(d.size)}</span>` : ""}</button></li>`)
    .join("")}</ul>${v.more ? `<p class="note">${v.more} more not shown.</p>` : ""}`;
}

function fileHtml(v) {
  const cut = v.truncated ? `<p class="note">Only the start of this file is shown.</p>` : "";
  if (v.kind === "markdown") return `<article class="md doc" data-dir="${esc(under(v, parentOf(v.rel)))}">${markdown(v.text)}</article>${cut}`;
  if (v.kind === "text") return `<pre class="code numbered"><code>${v.text.replace(/\n$/, "").split("\n").map((l) => `<span class="ln">${esc(l) || " "}</span>`).join("")}</code></pre>${cut}`;
  if (v.kind === "image") return files.img ? `<img class="shot" src="${files.img}" alt="${esc(base(v.rel))}">` : `<p class="note">Could not load the image.</p>`;
  return `<p class="note">A binary file; not shown.</p>`;
}

// ------------------------------------------------------------ changes

function rangeFromInput(text) {
  text = text.trim();
  if (!text) return "";
  if (/^\d+(\.\d+)?\s*(m|min|h|d|w)$/.test(text) || text === "today" || (/\d/.test(text) && !Number.isNaN(Date.parse(text)))) return "since=" + encodeURIComponent(text);
  return "base=" + encodeURIComponent(text);
}

function rangesHtml() {
  const presets = [["", "Uncommitted"], ["since=1h", "1 hour"], ["since=today", "Today"], ["since=7d", "7 days"]];
  const custom = range && !presets.some(([r]) => r === range) ? decodeURIComponent(range.split("=")[1]) : "";
  return `<div class="ranges">${presets.map(([r, l]) => `<button data-range="${r}" aria-pressed="${r === range}">${l}</button>`).join("")}
    <input id="custom" placeholder="3h, a date or a branch" aria-label="Since a time or commit" value="${esc(custom)}">
    <button id="reload" title="Read the changes again">Refresh</button></div>`;
}

const hunkId = (f, h) => `${f.path}\n${h.header}`;

function paintFile(f, key) {
  const share = f.hunks.length === f.total ? hunkWord(f.total) : `${f.hunks.length} of ${hunkWord(f.total)}`;
  const mine = (key && comments[key]) || [];
  let html = `<details class="diff-file" open><summary><span class="st ${esc(f.status)}">${esc(f.status)}</span><span class="path">${esc(f.path)}</span><span class="share">${share}</span></summary><div class="diff">`;
  if (f.shell) html += `<div class="more">Shell commands in ${f.shell.map((k) => esc(k.split(":")[1].slice(0, 8))).join(", ")} mention this file.</div>`;
  for (const h of f.hunks) {
    const id = hunkId(f, h);
    const badge = h.confidence ? `<span class="badge ${h.confidence}" title="${esc(CONFIDENCE[h.confidence])}">${h.confidence}</span>` : "";
    const btn = key ? `<button class="btn small comment-btn" data-comment="${esc(id)}">Comment</button>` : "";
    html += `<div class="hunk-head"><span>${esc(h.header)}</span>${badge}${btn}</div>`;
    for (const l of h.lines) html += `<div class="l ${l[0] === "+" ? "add" : l[0] === "-" ? "del" : ""}">${esc(l) || " "}</div>`;
    if (h.truncated) html += `<div class="more">… ${h.truncated} more lines</div>`;
    mine.forEach((c, n) => {
      if (c.id === id) html += `<div class="comment"><span class="text">${esc(c.text)}</span><button class="btn small" data-uncomment="${n}">Remove</button></div>`;
    });
    html += `<div class="comment" data-editor="${esc(id)}" hidden><textarea aria-label="Comment on this hunk"></textarea><button class="btn small primary" data-save-comment="${esc(id)}">Add</button></div>`;
  }
  if (!f.hunks.length) html += `<div class="more">Binary or too large to show.</div>`;
  return html + "</div></details>";
}

const legend = () => `<div class="legend">${Object.entries(CONFIDENCE).map(([k, v]) => `<span><span class="badge ${k}">${k}</span> ${esc(v)}</span>`).join("")}</div>`;

/** The review comments on a session's changes, as a request it can act on. */
function reviewText(key) {
  const list = comments[key] || [];
  const parts = list.map((c, n) => `${n + 1}. ${c.file}, at ${c.header}\n${c.excerpt.map((l) => `   > ${l}`).join("\n")}\n   ${c.text.replace(/\n/g, "\n   ")}`);
  return `Review comments on your uncommitted changes:\n\n${parts.join("\n\n")}\n\nPlease address them, then say what you changed.`;
}

function reviewBar(key, item) {
  const n = (comments[key] || []).length;
  if (!n) return "";
  return `<div class="review"><b>${plural(n, "comment")}</b> on this session's changes ${item && item.herdr ? `<button class="btn primary" data-act="send-review">Send to the session</button>` : ""}<button class="btn" data-act="copy-review">Copy as a request</button><button class="btn" data-act="clear-review">Discard</button><span class="note" id="review-note"></span></div>`;
}

/** The repository whose changes go with the entry. */
function repoOf(e) {
  if (!e) return null;
  if (e.item) return e.item.repo || null;
  return home ? home.root : null;
}

function syncChanges(e) {
  const i = e && e.item;
  const key = e ? `${e.key}|${e.state}|${i ? i.since : ""}` : "";
  if (key === shown.changesFor) return;
  const same = shown.changesFor && shown.changesFor.split("|")[0] === (e && e.key);
  shown.changesFor = key;
  // Same session in a new state (it finished a turn, wrote more): read its changes again.
  void paintChanges(e, same);
}

async function paintChanges(e, fresh = false) {
  const box = $("changes");
  if (!e) return void (box.innerHTML = "");
  const repo = repoOf(e);
  const head = (sub) => `<div class="changes-head"><h3>Changes</h3><span class="sub">${sub}</span>${repo ? rangesHtml() : ""}</div>`;
  if (!repo) {
    box.innerHTML = head("") + `<div class="note">${esc((e.item && e.item.cwd) || "Its folder")} is not in a git repository.</div>`;
    return;
  }
  const wanted = `${e.key}|${repo}|${range}`;
  shown.changes = wanted;
  if (!box.querySelector(".diff-file")) box.innerHTML = head(esc(base(repo))) + `<div class="note">Reading transcripts…</div>`;
  let v;
  try {
    v = await view(repo, fresh);
  } catch (err) {
    if (shown.changes === wanted) box.innerHTML = head(esc(base(repo))) + `<div class="note error">${esc(err.message)}</div>`;
    return;
  }
  if (shown.changes !== wanted) return; // the selection moved on meanwhile
  const where = `${esc(base(repo))} · ${esc(v.range)}`;
  if (e.key === "unknown") {
    box.innerHTML = head(where) + (v.unknown.length ? v.unknown.map((f) => paintFile(f)).join("") + legend() : `<div class="note">None ${range ? "in this range" : "in the working tree"}.</div>`);
    return;
  }
  const s = v.sessions.find((x) => x.key === e.key);
  if (!s) {
    box.innerHTML = head(where) + `<div class="note">No changes by this session ${range ? "in this range" : "in the working tree"}.</div>`;
    return;
  }
  const hunks = s.files.reduce((n, f) => n + f.hunks.length, 0);
  const stage = range ? "" : `<button class="btn primary" id="stage">Stage this session's changes</button>`;
  box.innerHTML = head(`${where} · ${plural(s.files.length, "file")}, ${hunkWord(hunks)}`) + `<div id="review-slot">${reviewBar(e.key, e.item)}</div>` +
    `<div class="stage-row">${stage}<code class="cmd">agent-deck add ${esc(s.id.slice(0, 8))}</code></div><div id="plan"></div>` +
    s.files.map((f) => paintFile(f, e.key)).join("") + legend();
  if (stage) $("stage").onclick = () => planStage(repo, s);
}

function list(items) {
  return items.length ? `<ul>${items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>` : "";
}

async function planStage(repo, s) {
  const box = $("plan");
  const path = `/api/stage?repo=${encodeURIComponent(repo)}&${range}`;
  box.innerHTML = `<div class="plan">Working out what to stage…</div>`;
  try {
    const plan = await post(path, { session: s.key });
    const items = [...plan.whole, ...plan.partial.map((p) => `${p.path}  (${hunkWord(p.hunks)} of its changes)`)];
    box.innerHTML = `<div class="plan">${items.length ? "This adds to the index:" : "Nothing to stage."}${list(items)}
      ${plan.skipped.length ? "Skipped:" + list(plan.skipped) : ""}
      ${items.length ? `<button class="btn primary" id="confirm">Stage</button> <button class="btn" id="cancel">Cancel</button>` : ""}</div>`;
    if (!items.length) return;
    $("cancel").onclick = () => (box.innerHTML = "");
    $("confirm").onclick = async () => {
      try {
        await post(path, { session: s.key, apply: true });
        box.innerHTML = `<div class="plan">Staged. Check with <code class="cmd">git diff --cached --stat</code>.</div>`;
      } catch (e) {
        box.innerHTML = `<div class="plan error">${esc(e.message)}</div>`;
      }
    };
  } catch (e) {
    box.innerHTML = `<div class="plan error">${esc(e.message)}</div>`;
  }
}

// ------------------------------------------------------------ a new session

let newFiles = []; // files sent for the new session's first message: [{ name, path }]
let projectsSeen = null; // /api/projects, for the model hints
let waitingFor = null; // a session just started, to open when it shows up: { key, pane, until }

/** Starting Claude Code or Codex from here: in which folder, with which model and effort, saying what. */
async function paintNew() {
  try {
    projectsSeen = await api("/api/projects");
  } catch (e) {
    $("special").innerHTML = pageHead("New session") + `<div class="note error">${esc(e.message)}</div>`;
    return;
  }
  if (selected !== "new") return;
  const p = projectsSeen;
  const last = stored("new", { agent: "claude", model: "", effort: "" });
  const from = lastSession && entry(lastSession) && entry(lastSession).item;
  const here = from ? from.repo || from.cwd : "";
  let html = pageHead("New session", "Starts Claude Code or Codex in a new herdr tab, in one of your sessions' folders, with your first message.");
  if (!p.herdr) html += `<p class="note error">herdr is off (--no-herdr): sessions cannot be started from here.</p>`;
  if (!p.projects.length) html += `<p class="note">No folders yet: they come from the running sessions.</p>`;
  html += `<div class="form">
    <label>Folder<select id="ns-dir">${p.projects.map((o) => `<option value="${esc(o.dir)}"${o.dir === here ? " selected" : ""}>${esc(o.name)} · ${esc(o.dir)}</option>`).join("")}</select></label>
    <div class="seg" role="radiogroup" aria-label="Agent"><label><input type="radio" name="ns-agent" value="claude"${last.agent !== "codex" ? " checked" : ""}> Claude Code</label><label><input type="radio" name="ns-agent" value="codex"${last.agent === "codex" ? " checked" : ""}> Codex</label></div>
    <div class="two"><label>Model<input id="ns-model" list="ns-models" placeholder="its default" value="${esc(last.model || "")}" autocomplete="off"></label><label>Effort<select id="ns-effort"><option value="">its default</option>${p.efforts.map((x) => `<option${x === last.effort ? " selected" : ""}>${x}</option>`).join("")}</select></label></div>
    <datalist id="ns-models"></datalist>
    <div class="check"><label><input type="checkbox" id="ns-wt"> In a new worktree, on a branch</label><input id="ns-branch" placeholder="branch, e.g. agent/export" aria-label="Branch name" autocomplete="off"></div>
    <label>First message<textarea id="ns-prompt" placeholder="What should it do?${fine.matches ? ` (${SEND_KEYS} starts it)` : ""}"></textarea></label>
    <div class="attached" id="ns-files"></div>
    <div class="actions"><button class="btn icon" data-act="ns-attach" title="Send files with it" aria-label="Send files">+</button><input type="file" id="ns-attach" multiple hidden><button class="btn primary" data-act="ns-start"${p.herdr && p.projects.length ? "" : " disabled"}>Start</button><span class="note" id="ns-note"></span></div>
  </div>`;
  $("special").innerHTML = html;
  modelChoices();
  paintNewFiles();
}

function modelChoices() {
  const agent = (document.querySelector('input[name="ns-agent"]:checked') || {}).value || "claude";
  if ($("ns-models") && projectsSeen) $("ns-models").innerHTML = (projectsSeen.models[agent] || []).map((m) => `<option value="${esc(m)}"></option>`).join("");
}

function paintNewFiles() {
  if ($("ns-files")) $("ns-files").innerHTML = newFiles.map((f, n) => `<span class="att" title="${esc(f.path)}"><span class="nm">${esc(f.name)}</span><button data-ns-unattach="${n}" aria-label="Do not send ${esc(f.name)}">×</button></span>`).join("");
}

async function uploadNew(list) {
  for (const f of list) {
    setNote("ns-note", `Sending ${f.name}…`, true);
    try {
      const up = await api(`/api/upload?project=${encodeURIComponent($("ns-dir").value)}`, { method: "POST", body: f, headers: { "content-type": "application/octet-stream", "x-file-name": encodeURIComponent(f.name) } });
      newFiles.push({ name: f.name, path: up.path });
    } catch (e) {
      return setNote("ns-note", `${f.name}: ${e.message}`, false);
    }
  }
  setNote("ns-note", "", true);
  paintNewFiles();
}

let starting = false;
async function startNew() {
  if (starting) return;
  const agent = document.querySelector('input[name="ns-agent"]:checked').value;
  const req = { dir: $("ns-dir").value, agent, model: $("ns-model").value.trim(), effort: $("ns-effort").value, branch: $("ns-wt").checked ? $("ns-branch").value.trim() : "", prompt: $("ns-prompt").value, files: newFiles.map((f) => f.path) };
  if ($("ns-wt").checked && !req.branch) return setNote("ns-note", "Name the branch for the worktree.", false);
  store("new", { agent, model: req.model, effort: req.effort });
  setNote("ns-note", "Starting: a tab in herdr, then the agent…", true);
  starting = true;
  const start = document.querySelector('[data-act="ns-start"]');
  if (start) start.disabled = true;
  try {
    const s = await post("/api/start", req);
    newFiles = [];
    $("ns-prompt").value = "";
    waitingFor = { key: s.key, pane: s.pane, until: Date.now() + 90_000 };
    setNote("ns-note", "Started. It opens here as soon as it shows up.", true);
  } catch (e) {
    setNote("ns-note", e.message, false);
  } finally {
    starting = false;
    if (start) start.disabled = false;
  }
}

/** The session just started, once the inbox lists it. */
function openStarted() {
  if (!waitingFor || !inbox) return;
  if (Date.now() > waitingFor.until) return void (waitingFor = null);
  const i = inbox.items.find((x) => (waitingFor.key && x.key === waitingFor.key) || (x.herdr && x.herdr.pane === waitingFor.pane));
  if (!i) return;
  waitingFor = null;
  select(i.key);
}

// ------------------------------------------------------------ activity

const KIND = {
  "needs-answer": ["asks you", "urgent"],
  "your-turn": ["finished its turn", "turn"],
  started: ["started", ""],
  ended: ["ended", ""],
  pr: ["opened a pull request", ""],
  "ci-failed": ["CI failed", "urgent"],
  "ci-passed": ["CI passed", "ok"],
  page: ["published a page", ""],
};

/** What happened in every session, newest first, by day. */
async function paintActivity() {
  if (!$("special").querySelector(".feed")) $("special").innerHTML = pageHead("Activity", "What happened in every session, newest first.") + `<div class="note">Looking…</div>`;
  let r;
  try {
    r = await api("/api/activity");
  } catch (e) {
    $("special").innerHTML = pageHead("Activity") + `<div class="note error">${esc(e.message)}</div>`;
    return;
  }
  if (selected !== "activity") return;
  const live = new Set(inbox ? inbox.items.map((i) => i.key) : []);
  let html = pageHead("Activity", "What happened in every session, newest first. Kept while the page runs, also when no one looks.");
  if (!r.events.length) html += `<p class="note">Nothing yet: changes show up here from now on.</p>`;
  let day = "";
  html += `<ol class="feed">`;
  for (const ev of r.events) {
    const d = new Date(ev.at).toDateString();
    if (d !== day) html += `<li class="day">${esc((day = d) === new Date().toDateString() ? "Today" : new Date(ev.at).toLocaleDateString())}</li>`;
    const [what, tone] = KIND[ev.kind] || [ev.kind, ""];
    const who = live.has(ev.key) ? `<button class="linkish" data-goto="${esc(ev.key)}">${esc(ev.name)}</button>` : `<b>${esc(ev.name)}</b>`;
    const link = ev.url ? ` <a href="${esc(ev.url)}" target="_blank" rel="noopener noreferrer">${esc(ev.text || ev.url)}</a>` : ev.text ? ` <span class="sub">${esc(ev.text)}</span>` : "";
    html += `<li class="ev ${tone}"><span class="t">${pad2(new Date(ev.at).getHours())}:${pad2(new Date(ev.at).getMinutes())}</span><span class="mark"></span><span class="what">${who} ${esc(what)}${ev.project ? ` <span class="sub">· ${esc(ev.project)}</span>` : ""}${link}</span></li>`;
  }
  $("special").innerHTML = html + `</ol>`;
}

// ------------------------------------------------------------ clean up

const pageHead = (title, sub) => `<div class="page-head"><h2><button class="icon-btn back" data-act="back" aria-label="Back to the sessions">${icon("back", 22)}</button>${title}</h2>${sub ? `<p class="page-sub">${sub}</p>` : ""}</div>`;

async function paintCleanup() {
  const sub = "Idle sessions and worktrees nobody uses. Nothing is closed or removed for you: copy the commands you want.";
  $("special").innerHTML = pageHead("Clean up", sub) + `<div class="note">Looking…</div>`;
  let c;
  try {
    c = await api("/api/cleanup");
  } catch (e) {
    $("special").innerHTML += `<div class="note error">${esc(e.message)}</div>`;
    return;
  }
  if (selected !== "cleanup") return;
  const mb = (b) => `${Math.round(b / 1e6)} MB`;
  const total = c.sessions.reduce((n, s) => n + (s.memory || 0), 0);
  let html = pageHead("Clean up", sub);
  html += `<div class="block"><div class="label">Idle sessions · ${c.sessions.length}${total ? ` · ${mb(total)} in all` : ""}</div>`;
  html += c.sessions.length
    ? `<table class="clean"><tr><th>Session</th><th>Idle</th><th class="num">Memory</th><th>Close</th></tr>${c.sessions
        .map((s) => `<tr><td><button class="linkish" data-goto="${esc(s.key)}">${esc(s.title || s.name)}</button><div class="sub">${esc(base(s.cwd))}</div></td><td>${esc(age(s.idleSince))}</td><td class="num">${s.memory ? mb(s.memory) : ""}</td><td>${s.close ? `<code class="cmd">${esc(s.close)}</code> <button class="btn small" data-copy="${esc(s.close)}">Copy</button>` : '<span class="sub">close it where it runs</span>'}<div class="sub">later: ${esc(s.resume)}</div></td></tr>`)
        .join("")}</table>`
    : `<p class="note">None.</p>`;
  html += `</div>`;
  const removable = c.worktrees.filter((w) => w.removable);
  const kept = c.worktrees.filter((w) => !w.removable);
  html += `<div class="block"><div class="label">Worktrees that can go · ${removable.length}</div>`;
  html += removable.length
    ? removable
        .map((w) => {
          const why = w.prunable ? "its folder is gone" : w.merged ? "merged" : "its remote branch was deleted";
          const cmds = w.commands.join(" && ");
          return `<div class="wt"><code class="cmd">${esc(w.path)}</code> ${w.branch ? `<span class="sub">${esc(w.branch)}</span>` : ""} <span class="sub">· ${esc(why)}</span><div class="actions"><code class="cmd">${esc(cmds)}</code><button class="btn small" data-copy="${esc(cmds)}">Copy</button></div></div>`;
        })
        .join("")
    : `<p class="note">None.</p>`;
  if (kept.length) html += `<p class="note">Kept: ${kept.map((w) => `${esc(base(w.path))} (${w.sessions.length ? "in use" : w.dirty ? "uncommitted changes" : w.locked ? "locked" : "not merged"})`).join(", ")}</p>`;
  html += `</div>`;
  $("special").innerHTML = html;
}

// ------------------------------------------------------------ remote access

async function paintRemote() {
  let r;
  try {
    r = await api("/api/remote");
  } catch (e) {
    $("special").innerHTML = pageHead("Remote") + `<div class="note error">${esc(e.message)}</div>`;
    return;
  }
  if (selected !== "remote") return;
  let html = pageHead(
    "Remote",
    r.origin
      ? `Open <a href="${esc(r.origin)}" target="_blank" rel="noopener">${esc(r.origin)}</a> on a device you added, and sign in with its passkey.`
      : "Remote access is off. Start <code class=\"cmd\">agent-deck view --remote https://…</code> behind a Cloudflare Tunnel to use this page from your phone.",
  );
  html += `<div class="actions">${mode === "local" && r.origin ? '<button class="btn primary" data-remote="pair">Add a phone</button>' : ""}${mode === "remote" ? '<button class="btn" data-remote="logout">Sign out</button>' : ""}</div><div id="pairing"></div>`;
  html += `<div class="block"><div class="label">Devices · ${r.devices.length}</div>`;
  html += r.devices.length
    ? `<table class="clean"><tr><th>Device</th><th>Added</th><th>Last used</th><th></th></tr>${r.devices
        .map((d) => `<tr><td>${esc(d.label)}${d.current ? ' <span class="sub">(this one)</span>' : ""}</td><td>${esc(when(d.createdAt))}</td><td>${esc(d.lastUsedAt ? when(d.lastUsedAt) : "")}</td><td><button class="btn small" data-remote="revoke" data-id="${esc(d.id)}">Remove</button></td></tr>`)
        .join("")}</table>`
    : `<p class="note">None yet.${mode === "local" && r.origin ? " Add one with the button above, or agent-deck remote pair." : ""}</p>`;
  html += `</div><div class="block"><div class="label">Done from other devices</div>`;
  html += r.log.length
    ? `<ul class="list">${r.log.map((e) => `<li><span class="sub">${esc(when(e.at))}</span> <b>${esc(e.device)}</b> ${esc(e.action)}${e.target ? ` <code class="cmd">${esc(e.target)}</code>` : ""}${e.detail ? `<div class="sub">${esc(e.detail)}</div>` : ""}</li>`).join("")}</ul>`
    : `<p class="note">Nothing yet.</p>`;
  $("special").innerHTML = html + "</div>";
}

// ------------------------------------------------------------ layouts

/**
 * Layouts: how the sessions fill the page. Focus is one session at a time; Deck and Grid show many
 * at once, as cards. Your own register the same way, from JS files in
 * ~/.config/agent-deck/layouts/ (inlined into this page):
 *
 *   AgentDeck.registerLayout({ id, label, title, paint(root, deck) })
 *
 * paint() runs on every refresh (every 5 seconds, and on changes). deck.sessions() gives the
 * sessions, most urgent first; deck.cards(container, sessions, "column" | "tile" | "mini") keeps
 * their cards in a container, with the conversation, the choices of a question and a reply box.
 */
const layouts = new Map();
let currentLayout = "focus";

function registerLayout(l) {
  if (!l || typeof l.id !== "string" || !l.label) return console.error("A layout needs an id and a label.", l);
  layouts.set(l.id, l);
  paintLayoutSwitch();
  if (l.id === stored("layout", "focus") && currentLayout !== l.id) setLayout(l.id);
}

/** The sessions, most urgent first, as the list orders them; idle and put-off ones only if asked. */
function sessionsInOrder(opts = {}) {
  const rank = (i) => (i.hold ? 5 : ORDER[i.state]);
  return (inbox ? inbox.items : [])
    .filter((i) => (opts.idle || i.state !== "stale") && (opts.held || !i.hold))
    .sort((a, b) => rank(a) - rank(b) || b.since - a.since);
}

const cardState = new Map(); // session → { messages, end, ready, busy, screen, screenSince }
const cardHtml = new WeakMap(); // a card's part → what it shows, to repaint only on change

/** A session's conversation for its card: the latest page, then what was written since. */
async function loadCard(i) {
  let st = cardState.get(i.key);
  if (!st) cardState.set(i.key, (st = { messages: [], end: 0, ready: false, busy: false, screen: null, screenSince: null }));
  if (st.busy) return;
  st.busy = true;
  const q = `key=${encodeURIComponent(i.key)}`;
  try {
    if (!st.ready) {
      const page = await api(`/api/chat?${q}&limit=20`);
      Object.assign(st, { messages: page.messages, end: page.end, ready: true });
    } else {
      const page = await api(`/api/chat?${q}&after=${st.end}`);
      if (page.reset) st.ready = false;
      else if (page.messages.length || page.end !== st.end) Object.assign(st, { end: page.end, messages: st.messages.concat(page.messages).slice(-300) });
    }
    if (i.state === "needs-answer" && i.herdr && st.screenSince !== i.since) {
      st.screen = await api(`/api/herdr/screen?${q}`);
      st.screenSince = i.since;
    }
  } catch {
    // next time
  } finally {
    st.busy = false;
  }
}

function cardHead(i) {
  return `<span class="dot ${i.state}"></span><button class="card-title" data-card-open title="Open ${esc(nameOf(i))}">${esc(nameOf(i))}</button><span class="age">${esc(age(i.since))}</span>`;
}

function cardMeta(i) {
  const done = i.tasks ? i.tasks.filter((t) => t.status === "completed").length : 0;
  const pr = prState(i);
  return [
    `<span class="pill ${i.state}">${i.hold ? "On hold" : STATE[i.state]}</span>`,
    `<span class="agent ${i.agent}">${agentName(i.agent)}</span>`,
    `<span>${esc(base(i.project || i.cwd || ""))}</span>`,
    i.tasks && i.tasks.length ? `<span class="chip" title="Tasks done">${done}/${i.tasks.length}</span>` : "",
    pr ? `<span class="chip ${pr}" title="Pull request CI: ${pr}">PR</span>` : "",
    i.asks ? '<span class="chip ask" title="Its last reply ends with a question">?</span>' : "",
  ].join("");
}

/** The end of the conversation: the last few things said, each run of steps as one line. */
function cardBody(i, size) {
  if (size === "mini") return `<div class="sub">${esc(i.state === "needs-answer" ? "" : snippet({ key: i.key, item: i }))}</div>`;
  const st = cardState.get(i.key);
  if (!st || !st.ready) return `<div class="sub">Reading…</div>`;
  const keep = size === "column" ? 14 : 3;
  const out = [];
  let said = 0;
  let steps = [];
  const flush = () => {
    if (!steps.length) return;
    const names = [...new Set(steps.map((x) => x.tool))].slice(0, 3).join(" · ");
    out.unshift(`<div class="card-steps">${plural(steps.length, "step")} · ${esc(names)}${steps.some((x) => x.error) ? ' · <span class="ci-failing">failed</span>' : ""}</div>`);
    steps = [];
  };
  for (let n = st.messages.length - 1; n >= 0 && said < keep; n--) {
    const m = st.messages[n];
    if (m.role === "tool") {
      steps.unshift(m);
      continue;
    }
    flush();
    out.unshift(msgHtml(m));
    if (m.role === "user" || m.role === "assistant") said++;
  }
  flush();
  return out.join("") || `<div class="sub">Nothing said yet.</div>`;
}

function cardAsk(i) {
  if (i.state !== "needs-answer") return "";
  const st = cardState.get(i.key);
  const p = i.herdr && st && st.screen && st.screen.prompt;
  let html = `<div class="reason">${esc(i.reason || "input needed")}</div>`;
  if (i.plan) html += `<details class="plan-doc"><summary>The plan</summary><div class="md">${markdown(i.plan)}</div></details>`;
  const questions = (i.questions || []).map((q) => q.question);
  if (!questions.length && p && p.question) questions.push(p.question);
  html += questions.map((q) => `<div class="q">${esc(q)}</div>`).join("");
  if (p) html += `<div class="choices" data-sig="${esc(p.sig || "")}">${p.choices.map((c, n) => `<button class="choice${c.selected ? " selected" : ""}" data-card-choose="${n}" data-label="${esc(c.label)}"><span class="k">${c.key}</span><span>${esc(c.label)}</span></button>`).join("")}</div>`;
  else if (i.herdr) html += `<div class="sub">Reading its screen…</div>`;
  else html += `<div class="sub">Answer it where it runs: <code class="cmd">${esc(i.resume)}</code></div>`;
  return html;
}

function cardQuick(i) {
  if (!i.herdr || i.state === "needs-answer") return "";
  if (i.state === "working") return `<button class="chip-btn" data-card-key="esc" title="Stop it (Esc)">${icon("stop", 12)} Stop</button>`;
  return i.state === "your-turn" && !i.hold ? quick.map((q) => `<button class="chip-btn" data-card-quick="${esc(q)}">${esc(q)}</button>`).join("") : "";
}

/** Shows `html` in a card's part, only when it changed (a reply being typed is never touched). */
function setPart(part, html, follow) {
  if (cardHtml.get(part) === html) return;
  const atEnd = part.scrollTop + part.clientHeight >= part.scrollHeight - 30;
  part.innerHTML = html;
  cardHtml.set(part, html);
  if (follow && (atEnd || !part.dataset.seen)) part.scrollTop = part.scrollHeight;
  part.dataset.seen = "1";
}

/** Keeps one card per session in `container`, in order, each showing what it should now. */
function cards(container, items, size = "tile") {
  const doc = container.ownerDocument;
  const want = new Set(items.map((i) => i.key));
  for (const el of [...container.children]) if (!want.has(el.dataset.card)) el.remove();
  let before = container.firstElementChild;
  for (const i of items) {
    let el = [...container.children].find((c) => c.dataset.card === i.key);
    if (!el) {
      el = doc.createElement("article");
      el.dataset.card = i.key;
      el.innerHTML = `<header class="card-head"></header><div class="card-meta"></div><div class="card-body"></div><div class="card-ask"></div><p class="card-note"></p><div class="card-reply"><div class="card-quick"></div><form class="card-form" data-card-form><textarea class="card-input" rows="1" aria-label="Reply to ${esc(nameOf(i))}" placeholder="${replyHint(i)}"></textarea><button class="send-btn small" aria-label="Send">${icon("send", 16)}</button></form><p class="card-outside"></p></div>`;
    }
    if (el !== before) container.insertBefore(el, before);
    before = el.nextElementSibling;
    el.className = `card ${size} s-${i.state}`;
    setPart(el.querySelector(".card-head"), cardHead(i));
    setPart(el.querySelector(".card-meta"), cardMeta(i));
    setPart(el.querySelector(".card-body"), cardBody(i, size), true);
    setPart(el.querySelector(".card-ask"), cardAsk(i));
    setPart(el.querySelector(".card-quick"), cardQuick(i));
    const outside = !i.herdr && i.state !== "stale";
    el.querySelector(".card-reply").hidden = i.herdr ? i.state === "needs-answer" : !outside;
    el.querySelector(".card-form").hidden = el.querySelector(".card-quick").hidden = !i.herdr;
    const input = el.querySelector(".card-input");
    if (input.placeholder !== replyHint(i)) input.placeholder = replyHint(i);
    setPart(el.querySelector(".card-outside"), outside ? `No replies from here: ${whyOutside(i)}.${movable(i) ? ` <button data-card-open>Open it</button> to move it into herdr.` : ""}` : "");
  }
}

/** What layouts get: the sessions, their cards, and the actions behind a card's buttons. */
const deck = {
  sessions: sessionsInOrder,
  cards,
  open: (key) => openFromLayout(key),
  send: (key, text) => post("/api/herdr/prompt", { key, text }),
  press: (key, k) => post("/api/herdr/keys", { key, keys: [k] }),
  choose: (key, index, label, sig) => post("/api/herdr/choose", { key, index, label, sig }),
  markdown,
  esc,
};
window.AgentDeck = { registerLayout, ...deck };

/** Loads what the cards on show need: their conversations, the screen of a question. */
async function refreshCards() {
  if (!inbox) return;
  const roots = [$("layout-root"), pip && pip.document.getElementById("pip-root")].filter(Boolean);
  const keys = new Set(roots.flatMap((r) => [...r.querySelectorAll("[data-card]")].map((c) => c.dataset.card)));
  await Promise.all([...keys].map((k) => inbox.items.find((x) => x.key === k)).filter(Boolean).map(loadCard));
  paintLayout();
}

function paintLayout() {
  const l = layouts.get(currentLayout);
  if (l && l.paint && inbox) {
    try {
      l.paint($("layout-root"), deck);
    } catch (e) {
      $("layout-root").innerHTML = `<div class="layout-empty error">The ${esc(l.label)} layout failed: ${esc(e.message)}</div>`;
    }
  }
  paintPip();
}

function paintLayoutSwitch() {
  const buttons = [...layouts.values()].map((l) => {
    const pic = l.icon || (ICONS[l.id] ? icon(l.id) : "");
    return `<button data-layout="${esc(l.id)}" aria-pressed="${l.id === currentLayout}" title="${esc(l.label)}: ${esc(l.title || "")}" aria-label="${esc(l.label)}">${pic || esc(l.label)}</button>`;
  });
  if ("documentPictureInPicture" in window) buttons.push(`<span class="seg-sep"></span><button data-popout aria-pressed="${!!pip}" title="Pop out: a small window on top of the others, with what waits on you" aria-label="Pop out">${icon("popout")}</button>`);
  const html = buttons.join("");
  if (shown.layouts !== html) $("layouts").innerHTML = shown.layouts = html;
  document.body.dataset.layout = currentLayout;
}

function setLayout(id) {
  if (!layouts.has(id)) id = "focus";
  if (id === currentLayout) return;
  const old = layouts.get(currentLayout);
  try {
    if (old && old.dispose) old.dispose();
  } catch {
    // its own business
  }
  currentLayout = id;
  store("layout", id);
  $("layout-root").innerHTML = "";
  shown = {};
  paintLayoutSwitch();
  paint();
  if (id !== "focus") void refreshCards();
}

/** A card's title opens the session, one at a time (Focus). */
function openFromLayout(key) {
  window.focus();
  setLayout("focus");
  openSession(key);
}

/** Runs a card's action, one at a time per card: a double tap must not send, or answer, twice. */
async function cardAct(key, card, run, done = card.querySelector(".send-btn")) {
  if (card.dataset.busy) return false;
  card.dataset.busy = "1";
  const note = card.querySelector(".card-note");
  try {
    await run();
    if (note) ((note.textContent = ""), (note.className = "card-note"));
    flash(done);
    setTimeout(() => {
      const st = cardState.get(key);
      if (st) st.screenSince = null; // read what it asks next
      void refreshCards();
    }, 900);
    return true;
  } catch (e) {
    if (note) ((note.textContent = e.message), (note.className = "card-note error"));
    return false;
  } finally {
    delete card.dataset.busy;
  }
}

/** The cards' buttons and reply boxes, in this page and in the popped-out window. */
function cardClick(ev) {
  const card = ev.target.closest && ev.target.closest("[data-card]");
  if (!card) return;
  const key = card.dataset.card;
  if (ev.target.closest("[data-card-open]")) return openFromLayout(key);
  const ch = ev.target.closest("[data-card-choose]");
  if (ch) {
    if (card.dataset.busy) return;
    ch.classList.add("picked"); // stays until the card reads what it asks next
    const sig = ch.closest(".choices").dataset.sig;
    return void cardAct(key, card, () => deck.choose(key, Number(ch.dataset.cardChoose), ch.dataset.label, sig), null).then((ok) => ok || ch.classList.remove("picked"));
  }
  const k = ev.target.closest("[data-card-key]");
  if (k) return void cardAct(key, card, () => deck.press(key, k.dataset.cardKey), k);
  const q = ev.target.closest("[data-card-quick]");
  if (q) return void cardAct(key, card, () => deck.send(key, q.dataset.cardQuick), null);
}
function cardSubmit(ev) {
  const form = ev.target.closest && ev.target.closest("[data-card-form]");
  if (!form) return;
  ev.preventDefault();
  const card = form.closest("[data-card]");
  const input = form.querySelector(".card-input");
  const sent = input.value;
  const text = sent.trim();
  if (text)
    void cardAct(card.dataset.card, card, () => deck.send(card.dataset.card, text)).then((ok) => {
      if (!ok) return;
      input.value = afterSent(input.value, sent);
      input.style.height = "";
    });
}
$("layout-root").addEventListener("click", cardClick);
$("layout-root").addEventListener("submit", cardSubmit);
/** In a card's reply box: Ctrl+Enter sends, Enter alone is a new line. */
function cardKey(ev) {
  if (!ev.target.classList || !ev.target.classList.contains("card-input") || !sendKeyPressed(ev)) return;
  ev.preventDefault();
  ev.target.form.requestSubmit();
}
$("layout-root").addEventListener("keydown", cardKey);
$("layout-root").addEventListener("input", (ev) => {
  const t = ev.target;
  if (!t.classList || !t.classList.contains("card-input")) return;
  t.style.height = "auto";
  t.style.height = t.scrollHeight + 2 + "px";
});
$("layouts").addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-layout]");
  if (b) return setLayout(b.dataset.layout);
  if (ev.target.closest("[data-popout]")) void popOut();
});

// Pop out: a small window that stays on top of everything (Document Picture-in-Picture).
let pip = null;

async function popOut() {
  if (pip) return pip.focus();
  try {
    pip = await documentPictureInPicture.requestWindow({ width: 400, height: 640 });
  } catch (e) {
    return alert(e.message);
  }
  for (const style of document.querySelectorAll("style")) pip.document.head.appendChild(style.cloneNode(true));
  pip.document.title = "Agent Deck";
  pip.document.body.className = "pip";
  pip.document.body.innerHTML = `<div id="pip-root"><header class="pip-head"><b>Agent Deck</b><span class="sub" id="pip-summary"></span></header><div class="layout-empty" id="pip-empty">Nothing waits on you.</div><div class="mini-list"></div></div>`;
  pip.document.addEventListener("click", cardClick);
  pip.document.addEventListener("submit", cardSubmit);
  pip.document.addEventListener("keydown", cardKey);
  pip.addEventListener("pagehide", () => {
    pip = null;
    shown.layouts = "";
    paintLayoutSwitch();
  });
  shown.layouts = "";
  paintLayoutSwitch();
  paintPip();
  void refreshCards();
}

/** The popped-out window: the sessions that wait on you, small. */
function paintPip() {
  if (!pip || !inbox) return;
  const list = sessionsInOrder().filter((i) => i.state === "needs-answer" || i.state === "your-turn");
  const d = pip.document;
  d.getElementById("pip-empty").hidden = list.length > 0;
  d.getElementById("pip-summary").textContent = $("summary").textContent;
  cards(d.querySelector(".mini-list"), list, "mini");
}

registerLayout({ id: "focus", label: "Focus", title: "One session at a time, with its details" });
registerLayout({
  id: "deck",
  label: "Deck",
  title: "Sessions side by side, as columns",
  paint(root, d) {
    if (!root.querySelector(".deck-cols")) root.innerHTML = `<div class="deck-cols"></div><div class="layout-empty" hidden>No running sessions.</div>`;
    const list = d.sessions();
    root.querySelector(".layout-empty").hidden = list.length > 0;
    d.cards(root.querySelector(".deck-cols"), list, "column");
  },
});
registerLayout({
  id: "grid",
  label: "Grid",
  title: "Every session as a tile",
  paint(root, d) {
    if (!root.querySelector(".grid-tiles")) root.innerHTML = `<div class="grid-tiles"></div><div class="layout-empty" hidden>No running sessions.</div>`;
    const list = d.sessions();
    root.querySelector(".layout-empty").hidden = list.length > 0;
    d.cards(root.querySelector(".grid-tiles"), list, "tile");
  },
});

// ------------------------------------------------------------ painting and events

/** Repaints what changed: the list, the header, and the parts of the session on show. */
function paint() {
  pickDefault();
  saveHash();
  paintHeader();
  paintLayoutSwitch();
  if (currentLayout !== "focus") return void paintLayout();
  paintNav();
  layout();
  if (special()) return;
  const e = entry(selected);
  paintHead(e);
  paintTabs(e);
  paintInfo(e);
  if (tab === "chat") {
    syncChat(e);
    paintDock(e);
    if ($("prompt") && !$("prompt").style.height) grow($("prompt"));
  } else if (tab === "changes") syncChanges(e);
  else if (tab === "files") syncFiles(e);
}

function select(key) {
  if (!key) return;
  if (selected && !SPECIAL.includes(selected)) lastSession = selected;
  if (key !== selected) {
    selected = key;
    shown = {};
    $("changes").innerHTML = "";
  }
  if (SPECIAL.includes(key)) {
    saveHash();
    paintHeader();
    paintNav();
    layout();
    void (key === "new" ? paintNew() : key === "activity" ? paintActivity() : key === "cleanup" ? paintCleanup() : paintRemote());
  } else paint();
}

/** Opens a session (or clean-up, remote); on a phone, over the list, so Back returns to it. */
function openSession(key) {
  if (phone.matches && document.body.dataset.view !== "session") {
    history.pushState({ session: key }, "");
    pushed = true;
    document.body.dataset.view = "session";
  }
  select(key);
}

function back() {
  if (pushed) return history.back();
  document.body.dataset.view = "list";
  if (special()) {
    selected = null;
    shown = {};
  }
  paint();
}

addEventListener("popstate", () => {
  pushed = false;
  if (document.body.dataset.view === "session") {
    document.body.dataset.view = "list";
    if (special()) selected = null;
    shown = {};
    paint();
  }
});
phone.addEventListener("change", () => {
  document.body.dataset.view = phone.matches ? "list" : "session";
  shown = {};
  paint();
});
wide.addEventListener("change", () => {
  shown = {};
  paint();
});

function setTab(t) {
  if (!TABS.includes(t)) return;
  tab = t;
  store("tab", t);
  paint();
  if (t === "chat") $("chat").scrollTop = $("chat").scrollHeight;
}

function setRange(r) {
  range = r;
  shown.changesFor = "";
  $("changes").innerHTML = "";
  if (inbox && inbox.home) void loadHome().then(paint);
  else paint();
}

async function act(name, el) {
  const i = entry(selected) && entry(selected).item;
  const note = (id, text, ok) => {
    const n = $(id);
    if (n) ((n.textContent = text), (n.className = "note" + (ok ? " ok" : " error")));
  };
  try {
    if (name === "back") back();
    else if (name === "earlier") await loadChat("earlier");
    else if (name === "expand") {
      const bubble = el.previousElementSibling;
      bubble.classList.remove("long");
      el.remove();
    } else if (name === "focus") {
      await post("/api/herdr/focus", { key: i.key });
      note("act-note", "Focused in herdr.", true);
    } else if (name === "later" || name === "done") {
      await post("/api/hold", { key: i.key, kind: name, until: el.dataset.until });
      await loadInbox();
    } else if (name === "release") {
      await post("/api/release", { key: i.key });
      await loadInbox();
    } else if (name === "screen") {
      screens.set(i.key, await api(`/api/herdr/screen?key=${encodeURIComponent(i.key)}`));
      if (selected !== i.key) return;
      shown.dock = "";
      paintDock(entry(selected));
      if ($("screen")) $("screen").scrollTop = $("screen").scrollHeight;
    } else if (name === "prompt") {
      const sent = $("prompt").value;
      const text = sent.trim();
      const files = attached.get(i.key) || [];
      if ((!text && !files.length) || sending.has(i.key)) return;
      if (!(await sendPrompt(i, files.length ? `${text}\n\nFiles I sent you:\n${files.map((f) => `- ${f.path}`).join("\n")}`.trim() : text))) return;
      const left = afterSent(drafts.get(i.key) || "", sent);
      left ? drafts.set(i.key, left) : drafts.delete(i.key);
      attached.delete(i.key);
      if ($("prompt") && selected === i.key) ($("prompt").value = left), grow($("prompt"));
      paintDock(entry(selected));
    } else if (name === "move") {
      const where = i.runsIn || "its terminal";
      if (!confirm(`Continue "${nameOf(i)}" in herdr?\n\nIt closes in ${where} and opens again in a new herdr tab, with the same conversation. Then you can reply to it from here.`)) return;
      if (moving.has(i.key)) return;
      moving.add(i.key);
      paintDock(entry(selected));
      try {
        const r = await post("/api/move", { key: i.key });
        if (!(await untilInHerdr(r.key || i.key)) && selected === i.key) note("answer-note", "herdr opened it, but it has not shown up here yet.", false);
      } finally {
        moving.delete(i.key);
        if (selected === i.key) paintDock(entry(selected));
      }
    } else if (name === "attach") {
      $("attach").click();
    } else if (name === "ns-attach") {
      $("ns-attach").click();
    } else if (name === "ns-start") {
      await startNew();
    } else if (name === "quick") {
      await sendPrompt(i, el.dataset.quick);
    } else if (name === "tune") {
      tuneOpen = !tuneOpen;
      el.setAttribute("aria-expanded", String(tuneOpen));
      el.setAttribute("aria-pressed", String(tuneOpen));
      $("tune-panel").hidden = !tuneOpen;
    } else if (name === "edit-quick") {
      const v = window.prompt("One-tap replies, separated by |. A tap sends one at once; leave it empty for none.", quick.join(" | "));
      if (v === null) return;
      quick = v.split("|").map((x) => x.trim()).filter(Boolean);
      store("quick", quick);
      shown.dock = "";
      paint();
    } else if (name === "copy-review") {
      await navigator.clipboard.writeText(reviewText(selected));
      note("review-note", "Copied. Paste it into the session.", true);
    } else if (name === "send-review") {
      await post("/api/herdr/prompt", { key: i.key, text: reviewText(selected) });
      delete comments[selected];
      store("comments", comments);
      $("review-slot").innerHTML = `<p class="note ok">Sent to the session.</p>`;
      shown.changesFor = "";
    } else if (name === "clear-review") {
      delete comments[selected];
      store("comments", comments);
      shown.changesFor = "";
      paint();
    }
  } catch (e) {
    if (name === "move") el.disabled = false;
    note(name === "prompt" || name === "screen" || name === "move" ? "answer-note" : name.endsWith("review") ? "review-note" : "act-note", e.message, false);
  }
}

/** Why a pull request's CI failed, under it in the details. */
async function readCi(url) {
  const key = selected;
  ciLogs.set(url, { loading: true });
  paintInfo(entry(selected));
  try {
    ciLogs.set(url, await api(`/api/ci?key=${encodeURIComponent(key)}&url=${encodeURIComponent(url)}`));
  } catch (e) {
    ciLogs.set(url, { error: e.message });
  }
  if (selected === key) paintInfo(entry(selected));
}

function setNote(id, text, ok) {
  const n = $(id);
  if (n) ((n.textContent = text), (n.className = "note" + (ok ? " ok" : " error")));
}

/** Uploads files into the session's repository, to go with its next prompt. */
async function uploadFiles(i, list) {
  for (const f of list) {
    setNote("answer-note", `Sending ${f.name}…`, true);
    try {
      const up = await api(`/api/upload?key=${encodeURIComponent(i.key)}`, { method: "POST", body: f, headers: { "content-type": "application/octet-stream", "x-file-name": encodeURIComponent(f.name) } });
      attached.set(i.key, [...(attached.get(i.key) || []), { name: f.name, path: up.path }]);
    } catch (e) {
      setNote("answer-note", `${f.name}: ${e.message}`, false);
      return;
    }
  }
  paintDock(entry(selected));
}

/** Sends a prompt, unless one is on its way to that session already (a double tap); says whether it sent. */
async function sendPrompt(i, text) {
  if (sending.has(i.key)) return false;
  sending.add(i.key);
  try {
    await post("/api/herdr/prompt", { key: i.key, text });
  } finally {
    sending.delete(i.key);
  }
  if (selected === i.key) {
    setNote("answer-note", "", true);
    flash(document.querySelector('#dock [data-act="prompt"]'));
  }
  setTimeout(() => void loadChat("newer"), 1500);
  return true;
}

/** What is left in a reply box once what it held at sending has gone: anything typed meanwhile. */
function afterSent(now, sent) {
  return now.startsWith(sent) ? now.slice(sent.length).replace(/^\s+/, "") : now;
}

/** A button says it worked by turning into a check for a moment, instead of a line of text. */
function flash(btn) {
  if (!btn) return;
  if (!btn.classList.contains("done")) btn.dataset.was = btn.innerHTML; // not the check of a flash under way
  btn.classList.add("done");
  btn.innerHTML = icon("check", btn.classList.contains("small") ? 16 : 20);
  clearTimeout(btn.flashing);
  btn.flashing = setTimeout(() => btn.isConnected && (btn.classList.remove("done"), (btn.innerHTML = btn.dataset.was)), 1200);
}

/** Picks a choice of the dialog on its screen (the server moves to it, checks, then presses Enter). */
async function chooseOne(el) {
  const i = entry(selected) && entry(selected).item;
  if (!i) return;
  const label = el.dataset.label;
  for (const b of document.querySelectorAll("#dock [data-choose]")) b.disabled = true;
  el.classList.add("picked");
  setNote("answer-note", "", true);
  try {
    await post("/api/herdr/choose", { key: i.key, index: Number(el.dataset.choose), label, sig: el.closest(".choices").dataset.sig });
  } catch (e) {
    el.classList.remove("picked");
    setNote("answer-note", e.message, false);
    for (const b of document.querySelectorAll("#dock [data-choose]")) b.disabled = false;
    return; // the reason stays up; "Read it again" shows the screen as it is
  }
  setTimeout(() => $("screen") && selected === i.key && act("screen"), 700); // what it asks next, if anything
}

async function pressKey(k, el) {
  const i = entry(selected) && entry(selected).item;
  try {
    await post("/api/herdr/keys", { key: i.key, keys: [k] });
    setNote("answer-note", "", true);
    flash(el);
    setTimeout(() => $("screen") && act("screen"), 700); // show what it did, and what it asks next
  } catch (e) {
    $("answer-note").textContent = e.message;
    $("answer-note").className = "note error";
  }
}

$("nav").addEventListener("click", (ev) => {
  const project = ev.target.closest(".project");
  const f = ev.target.closest(".fold");
  if (project || f) {
    toggle(project ? fold.projects : fold[f.dataset.fold], (project || f).dataset.project);
    saveFold();
    paintNav();
    return;
  }
  const b = ev.target.closest(".session");
  if (b) openSession(b.dataset.key);
});

document.addEventListener("keydown", (ev) => {
  if (ev.target.closest && ev.target.closest("input, textarea")) return;
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const step = ev.key === "ArrowDown" || ev.key === "j" ? 1 : ev.key === "ArrowUp" || ev.key === "k" ? -1 : 0;
  if (!step) return;
  const keys = [...$("nav").querySelectorAll(".session")].map((b) => b.dataset.key);
  if (!keys.length || phone.matches) return;
  ev.preventDefault();
  select(keys[Math.min(keys.length - 1, Math.max(0, keys.indexOf(selected) + step))]);
  const cur = $("nav").querySelector('.session[aria-current="true"]');
  if (cur) cur.scrollIntoView({ block: "nearest" });
});

/** One handler for the session parts: the conversation, its dock, the tabs, files, changes, details. */
$("app").addEventListener("click", (ev) => {
  const t = ev.target;
  if (t.closest("#nav")) return;
  const copy = t.closest("[data-copy]");
  if (copy) {
    navigator.clipboard?.writeText(copy.dataset.copy).then(() => ((copy.textContent = "Copied"), setTimeout(() => (copy.textContent = "Copy"), 1200)));
    return;
  }
  const tb = t.closest("[data-tab]");
  if (tb) return void setTab(tb.dataset.tab);
  const file = t.closest("[data-file]");
  if (file) {
    ev.preventDefault();
    let path = file.dataset.file;
    // A relative link in a Markdown file is relative to that file.
    const doc = file.closest(".doc");
    if (doc && !/^[/~]/.test(path)) path = `${doc.dataset.dir}/${path}`;
    void openFiles(path);
    if (tab !== "files") setTab("files");
    return;
  }
  const o = t.closest("[data-open]");
  if (o) {
    void openFiles(o.dataset.open);
    if (tab !== "files") setTab("files");
    return;
  }
  const go = t.closest("[data-goto]");
  if (go) return void openSession(go.dataset.goto);
  const a = t.closest("[data-act]");
  if (a) return void act(a.dataset.act, a);
  const ch = t.closest("[data-choose]");
  if (ch) return void chooseOne(ch);
  const k = t.closest("[data-key-press]");
  if (k) return void pressKey(k.dataset.keyPress, k);
  const q = t.closest("[data-quick]");
  if (q) return void act("quick", q);
  const sl = t.closest("[data-slash]");
  if (sl) {
    const i = entry(selected) && entry(selected).item;
    if (i) void sendPrompt(i, sl.dataset.slash).catch((e) => setNote("answer-note", e.message, false));
    return;
  }
  const ci = t.closest("[data-ci]");
  if (ci) return void readCi(ci.dataset.ci);
  const cis = t.closest("[data-ci-send]");
  if (cis) {
    const i = entry(selected) && entry(selected).item;
    return void sendPrompt(i, ciText(cis.dataset.ciSend, ciLogs.get(cis.dataset.ciSend))).then(
      () => ((cis.textContent = "Sent"), (cis.disabled = true)),
      (e) => alert(e.message),
    );
  }
  const nsu = t.closest("[data-ns-unattach]");
  if (nsu) {
    newFiles = newFiles.filter((_, n) => n !== Number(nsu.dataset.nsUnattach));
    return void paintNewFiles();
  }
  const un1 = t.closest("[data-unattach]");
  if (un1) {
    const list = (attached.get(selected) || []).filter((_, n) => n !== Number(un1.dataset.unattach));
    if (list.length) attached.set(selected, list);
    else attached.delete(selected);
    return void paintDock(entry(selected));
  }
  const c = t.closest("[data-comment]");
  if (c) {
    const ed = [...document.querySelectorAll("[data-editor]")].find((x) => x.dataset.editor === c.dataset.comment);
    if (ed) {
      ed.hidden = !ed.hidden;
      if (!ed.hidden) ed.querySelector("textarea").focus();
    }
    return;
  }
  const save = t.closest("[data-save-comment]");
  if (save) {
    const ed = save.closest("[data-editor]");
    const text = ed.querySelector("textarea").value.trim();
    if (!text) return;
    const [file, header] = save.dataset.saveComment.split("\n");
    const hunkHead = [...document.querySelectorAll(".hunk-head")].find((h) => h.querySelector("[data-comment]") && h.querySelector("[data-comment]").dataset.comment === save.dataset.saveComment);
    const excerpt = [];
    for (let n = hunkHead && hunkHead.nextElementSibling; n && n.classList.contains("l") && excerpt.length < 6; n = n.nextElementSibling) if (/^[+-]/.test(n.textContent)) excerpt.push(n.textContent);
    (comments[selected] ||= []).push({ id: save.dataset.saveComment, file, header, excerpt, text });
    store("comments", comments);
    shown.changesFor = "";
    paint();
    return;
  }
  const un = t.closest("[data-uncomment]");
  if (un) {
    (comments[selected] || []).splice(Number(un.dataset.uncomment), 1);
    if (!(comments[selected] || []).length) delete comments[selected];
    store("comments", comments);
    shown.changesFor = "";
    paint();
    return;
  }
  const r = t.closest("[data-range]");
  if (r) return void setRange(r.dataset.range);
  if (t.closest("#reload")) {
    void paintChanges(entry(selected), true);
    if (inbox && inbox.home) void loadHome().then(paint);
  }
});

// Opened or closed by you (a details drawn open fires "toggle" too, so count clicks).
$("dock").addEventListener("click", (ev) => {
  const summary = ev.target.closest && ev.target.closest("details.more-keys > summary");
  if (summary) keysOpen = !summary.parentElement.open;
});
// Remember which runs of steps were opened, across repaints.
$("chat").addEventListener("toggle", (ev) => {
  const d = ev.target;
  if (!d.matches || !d.matches("details.steps")) return;
  if (d.open) chat.open.add(d.dataset.group);
  else chat.open.delete(d.dataset.group);
}, true);
// Scrolled to the top: read the page before.
$("chat").addEventListener("scroll", () => {
  if ($("chat").scrollTop < 40 && chat.state === "ready" && chat.before !== undefined) void loadChat("earlier");
});

$("app").addEventListener("keydown", (ev) => {
  if (ev.target.id === "custom" && ev.key === "Enter") setRange(rangeFromInput(ev.target.value));
  if (!sendKeyPressed(ev)) return;
  if (ev.target.id === "prompt") ev.preventDefault(), act("prompt");
  if (ev.target.id === "ns-prompt") ev.preventDefault(), act("ns-start");
});
$("app").addEventListener("compositionstart", () => (composing = true));
$("app").addEventListener("compositionend", () => {
  composing = false;
  setTimeout(() => paintDock(entry(selected))); // what waited for it
});
$("app").addEventListener("change", (ev) => {
  const i = entry(selected) && entry(selected).item;
  if (ev.target.id === "attach" && i && ev.target.files.length) void uploadFiles(i, [...ev.target.files]);
  if (ev.target.id === "ns-attach" && ev.target.files.length) void uploadNew([...ev.target.files]);
  if (ev.target.name === "ns-agent") modelChoices();
});
$("app").addEventListener("input", (ev) => {
  if (ev.target.id === "prompt") {
    drafts.set(selected, ev.target.value);
    grow(ev.target);
  }
});

for (const id of SPECIAL) {
  $(id).onclick = () => {
    if (currentLayout !== "focus") return void (setLayout("focus"), openSession(id));
    if (selected !== id) return openSession(id);
    selected = null; // back to the sessions
    shown = {};
    paint();
  };
}

$("app").addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-remote]");
  if (!b) return;
  try {
    if (b.dataset.remote === "pair") {
      const p = await post("/api/remote/pair", {});
      $("pairing").innerHTML = `<div class="pair"><div class="qr">${p.svg}</div><div><p>Scan this with the phone to add, or open the link on it. It works once, until ${esc(new Date(p.expiresAt).toLocaleTimeString())}.</p><code class="cmd">${esc(p.url)}</code> <button class="btn small" data-copy="${esc(p.url)}">Copy</button></div></div>`;
    } else if (b.dataset.remote === "revoke") {
      if (!confirm("Remove this device? Its passkey stops working here.")) return;
      await post("/api/remote/revoke", { id: b.dataset.id });
      void paintRemote();
    } else if (b.dataset.remote === "logout") {
      await fetch("/auth/logout", { method: "POST", headers: { "x-agent-deck": "1" }, credentials: "same-origin" });
      location.assign("/login");
    }
  } catch (e) {
    $("pairing").innerHTML = `<p class="note error">${esc(e.message)}</p>`;
  }
});

setInterval(() => {
  if ((token || mode === "remote") && !document.hidden) void loadInbox();
}, 5000);

/*@layouts*/

if (!phone.matches) document.body.dataset.view = "session";
if (!token && mode === "local") $("main").innerHTML = '<div class="error empty">Open the full URL that agent-deck printed (it carries the access token).</div>';
else {
  void loadInbox();
  void initPush();
}
</script>
</body>
